t\">\u003c/div>\n    \u003cdiv class=\"side-note\">\u003cspan class=\"tiny-label\">本批定位\u003c/span>\u003cp>覆盖 RC 波形变换、施密特触发、单稳态与多谐振荡器。大纲对应点和拓展基础分别标明。\u003c/p>\u003c/div>\n    \u003cdiv class=\"side-actions\">\u003cbutton id=\"export-btn\">导出进度 ↗\u003c/button>\u003cbutton id=\"import-btn\">导入进度 ↙\u003c/button>\u003c/div>\n    \u003cinput id=\"import-file\" type=\"file\" accept=\"application/json,.json\" hidden>\n    \u003cp class=\"local-note\">进度保存在当前浏览器；换设备请先导出。\u003c/p>\n  \u003c/aside>\n  \u003cmain>\n    \u003csection id=\"view-learn\" class=\"view\" aria-label=\"知识点汇总\">\n      \u003csection class=\"section-heading\">\u003cdiv class=\"eyebrow\">DIGITAL ELECTRONICS / 01\u003c/div>\u003ch2>先把脉冲电路的“时间过程”看清楚\u003c/h2>\u003cp>从 RC 波形变换到触发整形，再到自激振荡。每节配图只表示题干所述的理想化工作关系。\u003c/p>\u003c/section>\n\u003cdiv class=\"lesson-grid\">\n\u003cdetails class=\"lesson-card\" id=\"learn-1\" open>\u003csummary>\u003cspan class=\"lesson-index\">01\u003c/span>\u003cspan>\u003cb>RC 脉冲波形变换\u003c/b>\u003csmall>比较时间常数与输入周期\u003c/small>\u003c/span>\u003c/summary>\u003cdiv class=\"lesson-content\">\u003cp>串联 C、接地 R 并从 R 取样是高通网络，适合观察快速边沿；串联 R、接地 C 并从 C 取样是低通网络，适合保留慢变化、平滑快速变化。输入周期记作 T，时间常数 τ=RC。\u003c/p>\u003cdiv data-diagram=\"rc-wave\" id=\"lesson-rc\">\u003c/div>\u003cul>\u003cli>τ≪T：方波平台期间输出衰减，边沿形成窄脉冲，近似微分。\u003c/li>\u003cli>τ≫T：电容在一个半周期内变化较小，输出为缓慢斜坡，近似积分。\u003c/li>\u003cli>上升沿的导数为正，下降沿的导数为负，微分脉冲极性相反。\u003c/li>\u003c/ul>\u003cdiv class=\"formula-block\">τ = RC　　微分条件：RC ≪ T　　积分条件：RC ≫ T\u003c/div>\u003cp class=\"muted\">边界条件和输出幅值还受输入幅值、负载、器件和实际电路影响；这里是理想基本网络的定性近似。\u003c/p>\u003cbutton data-goto=\"1\" class=\"lesson-practice\">练习本节 → 第 1 题\u003c/button>\u003c/div>\u003c/details>\n\u003cdetails class=\"lesson-card\" id=\"learn-2\">\u003csummary>\u003cspan class=\"lesson-index\">02\u003c/span>\u003cspan>\u003cb>施密特触发器\u003c/b>\u003csmall>双阈值、回差与抗抖动整形\u003c/small>\u003c/span>\u003c/summary>\u003cdiv class=\"lesson-content\">\u003cp>施密特触发器通过正反馈形成上、下两个翻转阈值。输入上升越过上阈值才翻转到另一输出状态；输入下降越过下阈值时再翻回。两个门限之间是状态保持区。\u003c/p>\u003cdiv data-diagram=\"schmitt\" id=\"lesson-schmitt\">\u003c/div>\u003cdiv class=\"formula-block\">回差宽度：ΔV\u003csub>H\u003c/sub> = V\u003csub>H\u003c/sub> − V\u003csub>L\u003c/sub>\u003cbr>对称门限特例：V\u003csub>H\u003c/sub>=+βV\u003csub>sat\u003c/sub>，V\u003csub>L\u003c/sub>=−βV\u003csub>sat\u003c/sub>\u003c/div>\u003cp>合适的回差可以减轻阈值附近小扰动造成的反复翻转，常用于将慢变或有噪声的信号整形成较干净的逻辑波形。\u003c/p>\u003cp class=\"muted\">实际上阈值方向取决于反相/非反相连接，阈值公式取决于具体电路；计算时先读清拓扑和输出饱和电平。\u003c/p>\u003cbutton data-goto=\"5\" class=\"lesson-practice\">练习本节 → 第 5 题\u003c/button>\u003c/div>\u003c/details>\n\u003cdetails class=\"lesson-card\" id=\"learn-3\">\u003csummary>\u003cspan class=\"lesson-index\">03\u003c/span>\u003cspan>\u003cb>单稳态触发电路\u003c/b>\u003csmall>一个稳态，触发后暂时离开\u003c/small>\u003c/span>\u003c/summary>\u003cdiv class=\"lesson-content\">\u003cp>单稳态电路具有一个稳定状态。满足电路规定的触发条件后，输出进入暂稳态，定时网络经过一段时间后使电路自动回到稳态，产生一个有限宽度的脉冲。\u003c/p>\u003cdiv data-diagram=\"monostable\" id=\"lesson-monostable\">\u003c/div>\u003cul>\u003cli>触发边沿的极性由实现电路决定，题干须给明。\u003c/li>\u003cli>定时电容的充放电过程决定暂稳态持续时间。\u003c/li>\u003cli>脉宽与恢复时间不同；过早再次触发时，响应可能受前一周期影响。\u003c/li>\u003c/ul>\u003cdiv class=\"formula-block\">若题目明确给出模型：t\u003csub>W\u003c/sub> ≈ kRC\u003cbr>本批指定简算模型：k=0.69\u003c/div>\u003cp class=\"muted\">不同门电路、芯片与阈值对应不同系数；0.69RC 仅用于题干明确指定的模型。\u003c/p>\u003cbutton data-goto=\"10\" class=\"lesson-practice\">练习本节 → 第 10 题\u003c/button>\u003c/div>\u003c/details>\n\u003cdetails class=\"lesson-card\" id=\"learn-4\">\u003csummary>\u003cspan class=\"lesson-index\">04\u003c/span>\u003cspan>\u003cb>多谐振荡器\u003c/b>\u003csmall>无稳态，自激输出周期脉冲\u003c/small>\u003c/span>\u003c/summary>\u003cdiv class=\"lesson-content\">\u003cp>多谐振荡器没有稳定状态，电路依靠 RC 定时网络的周期性充放电和门限翻转自行振荡，不需要周期性外部触发。输出常为矩形脉冲，定时电容电压在翻转门限之间往复变化。\u003c/p>\u003cdiv data-diagram=\"astable\" id=\"lesson-astable\">\u003c/div>\u003cdiv class=\"formula-block\">周期：T = t\u003csub>H\u003c/sub> + t\u003csub>L\u003c/sub>　　频率：f = 1/T\u003cbr>高电平占空比：D\u003csub>H\u003c/sub> = t\u003csub>H\u003c/sub>/T\u003c/div>\u003cp>增大定时电容通常会增加充放电时间，使周期增长、频率降低。周期的精确公式和占空比取决于拓扑、门限和充放电路径，须按具体电路推导。\u003c/p>\u003cdiv class=\"callout\">与 801 大纲的关联：大纲模拟部分明确列有“非正弦振荡器的识别”。本节以数字门电路 RC 振荡器作补充理解，题目不把未单列内容说成考纲的明确计算要求。\u003c/div>\u003cbutton data-goto=\"14\" class=\"lesson-practice\">练习本节 → 第 14 题\u003c/button>\u003c/div>\u003c/details>\n\u003c/div>\r\n\n    \u003c/section>\n    \u003csection id=\"view-practice\" class=\"view\" hidden>\n      \u003cdiv class=\"learning-return\">\u003cspan>遇到没学过的概念，可以随时回来查。\u003c/span>\u003cbutton class=\"text-button\" data-view=\"learn\">← 知识点汇总\u003c/button>\u003c/div>\n      \u003cdiv class=\"progress-strip\" aria-label=\"练习进度\">\u003cdiv>\u003cspan>已作答\u003c/span>\u003cstrong id=\"stat-done\">0\u003csmall>/ 18\u003c/small>\u003c/strong>\u003c/div>\u003cdiv>\u003cspan>答对\u003c/span>\u003cstrong id=\"stat-right\">0\u003c/strong>\u003c/div>\u003cdiv>\u003cspan>正确率 · 按已答计\u003c/span>\u003cstrong id=\"stat-rate\">—\u003c/strong>\u003c/div>\u003cdiv>\u003cspan>当前错题\u003c/span>\u003cstrong id=\"stat-wrong\">0\u003c/strong>\u003c/div>\u003cdiv class=\"progress-track\">\u003cdiv class=\"track\">\u003ci id=\"progress-fill\">\u003c/i>\u003c/div>\u003cspan id=\"progress-text\">从第一题开始\u003c/span>\u003c/div>\u003c/div>\n      \u003cdiv class=\"toolbar\">\u003cdiv class=\"filter-tabs\" role=\"group\" aria-label=\"题目筛选\">\u003cbutton class=\"filter active\" data-filter=\"all\">全部\u003c/button>\u003cbutton class=\"filter\" data-filter=\"unanswered\">未答\u003c/button>\u003cbutton class=\"filter\" data-filter=\"wrong\">错题\u003c/button>\u003cbutton class=\"filter\" data-filter=\"starred\">收藏\u003c/button>\u003c/div>\u003clabel class=\"search\">\u003cspan>⌕\u003c/span>\u003cinput id=\"search\" type=\"search\" placeholder=\"搜索知识点或题目\" aria-label=\"搜索知识点或题目\">\u003c/label>\u003c/div>\n      \u003cdiv class=\"practice-layout\">\u003cdiv id=\"question-area\" aria-live=\"polite\">\u003c/div>\u003caside class=\"question-map\">\u003cdiv class=\"map-title\">题目导航\u003cspan id=\"filtered-count\">\u003c/span>\u003c/div>\u003cdiv class=\"map-legend\">\u003cspan>\u003ci class=\"dot right\">\u003c/i>答对\u003c/span>\u003cspan>\u003ci class=\"dot wrong\">\u003c/i>答错\u003c/span>\u003cspan>☆ 已收藏\u003c/span>\u003c/div>\u003cdiv id=\"question-grid\">\u003c/div>\u003cdiv class=\"map-foot\">\u003cp id=\"module-description\">\u003c/p>\u003cbutton id=\"continue-btn\" class=\"text-button\">跳到下一道未答 →\u003c/button>\u003c/div>\u003c/aside>\u003c/div>\n      \u003cdiv class=\"print-bar\">\u003cp>需要纸上练习？题目、图和解析可一起打印。\u003c/p>\u003cdiv>\u003cbutton id=\"print-questions\">打印全部题目\u003c/button>\u003cbutton id=\"print-solutions\">打印题目与解析\u003c/button>\u003c/div>\u003c/div>\n    \u003c/section>\n    \u003csection id=\"view-coverage\" class=\"view\" hidden>\u003cdiv class=\"section-heading\">\u003cdiv class=\"eyebrow\">COVERAGE MAP\u003c/div>\u003ch2>18 道题，逐项对应知识点\u003c/h2>\u003cp>覆盖清单只统计本批实际考查的内容，不代表命题概率。\u003c/p>\u003c/div>\u003cdiv id=\"coverage-summary\" class=\"coverage-summary\">\u003c/div>\u003cdiv class=\"coverage-table-wrap\">\u003ctable class=\"coverage-table\">\u003cthead>\u003ctr>\u003cth>教材定位\u003c/th>\u003cth>知识节点\u003c/th>\u003cth>对应题号\u003c/th>\u003cth>已答\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"coverage-body\">\u003c/tbody>\u003c/table>\u003c/div>\u003c/section>\n    \u003csection id=\"view-guide\" class=\"view\" hidden>\u003cdiv class=\"section-heading\">\u003cdiv class=\"eyebrow\">SCOPE & CONVENTIONS\u003c/div>\u003ch2>范围、来源与使用说明\u003c/h2>\u003cp>原创基础题，先学后练。计算模型均以题干给定条件为准。\u003c/p>\u003c/div>\u003cdiv class=\"guide-card\">\u003ch3>与 801 考试大纲的关系\u003c/h3>\u003cp>深圳大学 2027 年 801《电子电路》大纲数电部分列出门电路、组合逻辑、触发器、时序逻辑和同步计数器；模拟部分列出“非正弦振荡器的识别”。大纲没有将 RC 脉冲变换、施密特触发器、单稳态电路逐项列为数电考点。\u003c/p>\u003cp>因此，本批将 RC、施密特和单稳态作为理解脉冲波形的拓展基础；多谐振荡器部分重点练习自激电路识别、波形和基本参数关系。本材料不是深圳大学官方试题，不表示命题预测。\u003c/p>\u003cul class=\"source-list\">\u003cli>\u003ca href=\"https://ehall.szu.edu.cn/gsapp/sys/zsjzapp/index.do#/2027/2/801\" target=\"_blank\" rel=\"noopener\">深圳大学：2027 年 801 电子电路考试大纲 ↗\u003c/a>\u003c/li>\u003c/ul>\u003cp class=\"muted\">题中 RC、施密特和单稳态电路均采用明确给出的基本模型。器件阈值、触发极性与定时系数依具体拓扑而异。\u003c/p>\u003c/div>\u003cdiv class=\"guide-card\">\u003ch3>符号与计算约定\u003c/h3>\u003cdiv class=\"formula-block\">τ = RC　　微分近似：RC ≪ T　　积分近似：RC ≫ T\u003cbr>回差宽度：ΔV\u003csub>H\u003c/sub> = V\u003csub>H\u003c/sub> − V\u003csub>L\u003c/sub>\u003cbr>指定单稳态模型：t\u003csub>W\u003c/sub> ≈ 0.69RC\u003cbr>周期：T = t\u003csub>H\u003c/sub> + t\u003csub>L\u003c/sub>　　f = 1/T　　D\u003csub>H\u003c/sub> = t\u003csub>H\u003c/sub>/T\u003c/div>\u003cp>0.69RC 只用于题目明确给出的模型；多谐振荡器周期取决于门限与充放电拓扑。回差门限公式也必须结合实际连接分析。\u003c/p>\u003c/div>\u003cdiv class=\"guide-card\">\u003ch3>作答、打印与保存\u003c/h3>\u003cp>选择选项后核对答案，解析同时说明依据和常见误区。可以按模块筛选、搜索、收藏和复习错题。进度独立保存在本批的浏览器记录中，换设备前请导出 JSON。\u003c/p>\u003cp>打印可选择只含题目的练习版，或附答案、详解和易错提醒的解析版。\u003c/p>\u003cbutton id=\"reset-btn\" class=\"danger-button\">清空本批全部进度与收藏\u003c/button>\u003c/div>\u003c/section>\n\n    \u003cfooter class=\"footer\">\u003cspan>深大 801 · 数电拓展练习 01\u003c/span>\u003cspan>18 道精选 · 第一批 v1.0\u003c/span>\u003c/footer>\n  \u003c/main>\n\u003c/div>\n\u003cdiv id=\"toast\" role=\"status\" hidden>\u003c/div>\u003cdiv id=\"print-root\">\u003c/div>\n\u003cscript>const BANK={version:1,edition:'digital-01',title:'脉冲产生与整形',subtitle:'深大 801 电子电路 · 数电第一批 · 18 道精选',groups:[\n{id:'A',name:'RC 脉冲波形变换',section:'脉冲波形变换',scope:'拓展基础',intro:'比较微分与积分电路的时间常数、波形和应用。'},\n{id:'B',name:'施密特触发器',section:'施密特触发器',scope:'拓展基础',intro:'抓住双阈值、回差与输入变化方向。'},\n{id:'C',name:'单稳态触发电路',section:'单稳态电路',scope:'拓展基础',intro:'辨认稳态、暂稳态、触发条件和脉宽。'},\n{id:'D',name:'多谐振荡器',section:'多谐振荡器',scope:'大纲关联',intro:'识别无稳态的自激脉冲电路，读周期、频率和占空比。'}],questions:[]};\nfunction Q(id,group,tag,difficulty,stem,options,answer,explanation,pitfall,fig=''){BANK.questions.push({id,number:id,group,tag,difficulty,stem,options,answer,explanation,pitfall,fig});}\nQ(1,'A','微分条件','基础','RC 微分电路由串联电容 C、接地电阻 R 组成，输出取自 R 两端。要让它对输入方波产生较窄的正、负尖脉冲，时间常数 τ=RC 应满足', ['τ 远大于方波周期 T','τ 远小于方波周期 T','τ 与 T 无关','只需增大输入直流分量'],1,'B 正确：当 RC 相对输入周期足够小时，电路主要响应方波边沿的快速变化，方波平台期间输出迅速衰减，形成窄脉冲。A 更接近积分条件；C 忽略时间尺度；D 直流分量不决定微分条件。','判断微分还是积分，比较 RC 与输入周期，不要只看元件名称。','rc-wave');\nQ(2,'A','边沿极性','理解','理想对称方波经微分电路后，输入上升沿和下降沿分别对应输出', ['正尖脉冲、负尖脉冲','负尖脉冲、正尖脉冲','两次都是正尖脉冲','两次都是负尖脉冲'],0,'A 正确：微分电路输出近似与输入变化率成正比。上升沿变化率为正，下降沿变化率为负，因此两种边沿产生极性相反的尖脉冲。其他选项都丢失了边沿方向信息。','先看输入边沿是上升还是下降，再判断 du/dt 的正负。','rc-wave');\nQ(3,'A','积分条件','基础','串联电阻 R、接地电容 C 构成低通网络，输出取自 C 两端。输入为周期 T 的方波时，若 τ=RC 远大于 T，输出更接近', ['边沿处的窄尖脉冲','与输入完全相同的方波','按输入平均值缓慢变化的三角形或斜坡','恒为零'],2,'C 正确：当 RC 远大于周期时，电容在单个半周期内只发生较小的充放电，输出呈缓慢上升、下降的斜坡；对称方波下近似为三角波。A 对应微分；B 是带宽足够且时间常数小的跟随情况；D 不成立。','积分输出仍随时间变化；“积分”不意味着输出恒定。','rc-wave');\nQ(4,'A','波形用途','应用','某传感器输出为含毛刺的慢变化电压，需要先抑制快速变化再观察趋势。下列基本连接及取样方式最合适的是', ['C 串联、R 接地，取 R 端并把 RC 做得远小于干扰周期','R 串联、C 接地，取 C 端并把 RC 选得较大','只串接一个电阻，不考虑负载','只并联一个电容并将其两端短路'],1,'B 正确：串联 R、并联 C 且从电容取样构成低通积分/平滑网络，可衰减高频毛刺并保留较慢的变化。A 是高通特性且小时间常数不能平滑；C 没有形成频率选择；D 等于短路信号。','输出端取在哪个元件上，会改变电路的频率特性。','rc-wave');\nQ(5,'B','回差特性','基础','施密特触发器有两个不同的输入翻转阈值。输入缓慢上升后再缓慢下降时，两个方向的翻转电压通常', ['完全相同','上升时较低、下降时较高','取决于输入变化方向，形成回差','随机变化且无法重复'],2,'C 正确：施密特触发器具有正反馈，输出状态会改变有效翻转阈值。上升和下降过程分别在不同门限翻转，形成滞回回线。A 描述单一阈值比较；B 把常见非反相回差方向写反；D 不符合确定性电路。','记住两个门限和回差宽度，不能把施密特触发器当作单阈值比较器。','schmitt');\nQ(6,'B','上升越阈翻转','理解','某非反相施密特触发器的上阈值为 +2 V、下阈值为 −2 V。输入从 0 V 缓慢上升并超过 +2 V 时，输出应', ['在 +2 V 附近翻到高态','在 +2 V 附近翻到低态','等输入降到 −2 V 才翻转','在 0 V 必然连续放大'],0,'A 正确：输入上升并越过上阈值时，输出切换到高态；之后即使输入回到 0 V，输出仍保持当前状态，直到输入下降越过下阈值。B 颠倒输出方向；C 混淆下降过程；D 把比较器当成线性放大器。','翻转方向要与题设“非反相”一致，并跟踪输出状态保持区间。','schmitt');\nQ(7,'B','抗噪整形','应用','一个缓慢变化且叠加小幅噪声的输入在普通比较器单一阈值附近反复波动。改用带合适回差的施密特触发器，主要效果是', ['任何噪声都被完全消除','输入越过一个门限后，较小的反向扰动不易立即造成再次翻转','输出变成与输入幅度成比例的正弦波','自动提高输入信号的频率'],1,'B 正确：输出翻转后，回差使反方向必须越过另一个门限，小幅门限附近噪声不易引发连续抖动，因此能整形并提高抗干扰能力。A 夸大作用；C、D 均不是施密特触发器的功能。','回差能避免门限附近的小扰动反复翻转，但不能消除叠加在输入上的噪声本身。','schmitt');\nQ(8,'B','回差宽度计算','简算','某施密特触发器上、下阈值分别为 +1.8 V 与 −1.2 V。回差宽度 ΔV_H 为', ['0.6 V','1.2 V','3.0 V','−3.0 V'],2,'C 正确：回差宽度等于上阈值减下阈值，即 ΔV_H=1.8−(−1.2)=3.0 V。A、B 不是两个门限间距；D 把减法顺序颠倒，宽度应为正值。','下阈值是负数时，要特别注意减负数的符号变化。','schmitt');\nQ(9,'B','分压正反馈门限','简算','非反相施密特电路中，参考端为 0 V，输出饱和电平为 ±6 V；正反馈分压网络令输入阈值等于输出的 β 倍，β=1/3。上、下阈值依次为', ['+2 V、−2 V','+3 V、−3 V','+6 V、−6 V','−2 V、+2 V'],0,'A 正确：阈值幅值为 β|V_Osat|=(1/3)×6=2 V。输出处于正、负饱和时分别得到 +2 V 和 −2 V。B、C 的比例不符；D 把上下阈值顺序反过来。','此题已给定特定正反馈分压模型；不要将 ±βV_Osat 套用于其他拓扑或非对称电源。','schmitt');\nQ(10,'C','稳定状态','基础','典型单稳态触发电路在没有外部触发时，具有', ['两个都不稳定的状态','两个都稳定的状态','一个稳定状态和一个暂稳态','连续变化而没有任何状态'],2,'C 正确：单稳态电路平时保持唯一稳态，触发后暂时进入另一状态，经过定时过程再自动返回。A 描述无稳态多谐振荡器；B 更像双稳态电路；D 不符合数字脉冲电路的状态描述。','单稳态的“单”指只有一个稳态，不是只能输出一个电平。','monostable');\nQ(11,'C','脉冲宽度','简算','某门电路单稳态电路按题设模型 t_W≈0.69RC，R=100 kΩ、C=0.1 μF。输出暂稳态脉冲宽度约为', ['0.69 ms','6.9 ms','69 ms','690 ms'],1,'B 正确：RC=100×10^3×0.1×10^−6=0.01 s=10 ms，因此 t_W≈0.69×10=6.9 ms。A 少乘十；C、D 多乘了数量级。','先把 R、C 换算到同一单位，再乘题目给定的 0.69。','monostable');\nQ(12,'C','触发条件','理解','某单稳态电路规定由输入负跳变触发。输入出现从高电平跃迁到低电平的边沿后，输出应', ['仅在输入高电平期间跟随输入','触发后维持暂稳态一段时间，再自动恢复','持续振荡直到断电','无论触发与否都周期翻转'],1,'B 正确：负跳变满足题设触发条件，单稳态在触发后输出一个有限宽度脉冲，随后返回稳态。A 是电平跟随；C、D 描述的是自激振荡而非单稳态响应。','触发边沿极性由具体电路决定；本题已明确给出负跳变。','monostable');\nQ(13,'C','恢复时间','应用','单稳态电路的恢复时间约为 5 ms。若连续触发脉冲的间隔明显短于恢复时间，最可能的结果是', ['每个脉冲都必定得到完全相同的独立输出脉冲','电路可能尚未恢复，后续响应会受前一脉冲影响','电路自动变成理想双稳态','输出脉宽必定变为零'],1,'B 正确：恢复时间内定时电容和内部状态尚未回到初始条件，过早的再次触发可能被忽略、延长或改变响应，需根据具体电路分析。A 忽略恢复过程；C、D 均无必然依据。','脉冲宽度和恢复时间是不同概念；重复触发能力取决于电路结构。','monostable');\nQ(14,'D','无稳态识别','基础','一个门电路加 RC 反馈，输出无需周期性外部触发即可在高、低电平间反复翻转。该电路属于', ['单稳态触发器','双稳态触发器','多谐振荡器（无稳态电路）','线性积分放大器'],2,'C 正确：电路自身反复充放电并翻转，没有稳定输出状态，因此属于无稳态多谐振荡器。A 需要触发后返回一个稳态；B 可保持两个状态但不自发振荡；D 不描述逻辑翻转。','按稳定状态数量与是否自激区分单稳态、双稳态和无稳态。','astable');\nQ(15,'D','RC 振荡趋势','理解','典型 RC 多谐振荡器保持门限比例和电路拓扑不变，只把定时电容 C 增大为原来的 2 倍。振荡周期通常', ['减小为一半','增大，近似随 RC 增大','保持不变','立即变成单稳态'],1,'B 正确：电容充放电达到翻转门限所需时间随 RC 时间尺度增长；门限比例等条件不变时，周期随 RC 增大，频率相应降低。A 方向相反；C 忽略定时电容；D 没有根据。','精确比例常数取决于门限和具体电路；本题只判断趋势。','astable');\nQ(16,'D','波形识别','读图','某自激脉冲电路的输出波形在高、低电平间周期翻转，定时电容电压在两个门限间往复充放电。最符合这一描述的是', ['单稳态电路的一个孤立暂态','施密特触发器的静态传输曲线','RC 微分电路对单个边沿的响应','多谐振荡器的输出与定时电容波形'],3,'D 正确：自激周期翻转的方波输出及往复充放电的定时电容电压，是多谐振荡器的典型表现。A 只有触发后的一次暂态；B 是输入输出关系而非时间波形；C 只在边沿产生尖脉冲。','要同时看重复周期、是否需要触发以及电容的周期充放电。','astable');\nQ(17,'D','周期频率换算','简算','示波器测得某多谐振荡器输出周期 T=2.5 ms，其频率 f 为', ['40 Hz','250 Hz','400 Hz','2.5 kHz'],2,'C 正确：f=1/T=1/(2.5×10^−3 s)=400 Hz。A、B、D 都是单位换算或倒数计算错误。','毫秒换算为 10^−3 秒，频率单位是 Hz。','astable');\nQ(18,'D','占空比读图','简算','某多谐振荡器周期为 4 ms，高电平持续 1.5 ms。按高电平占空比定义，D_H 为', ['25%','37.5%','60%','62.5%'],1,'B 正确：D_H=t_H/T=1.5/4=0.375=37.5%。A 把低电平时间当作高电平时间；C、D 不是本题的比值。','占空比必须先确认题目说的是高电平还是低电平。','astable');\nconst COVERAGE=[\n['RC 波形变换','τ≪T 时微分电路的尖脉冲条件',[1]],['RC 波形变换','上升沿、下降沿与脉冲极性',[2]],['RC 波形变换','τ≫T 时积分输出的斜坡近似',[3]],['RC 波形变换','RC 低通对快速毛刺的平滑作用',[4]],\n['施密特触发器','双阈值与回差特性',[5]],['施密特触发器','上升输入越过上阈值时的翻转',[6]],['施密特触发器','回差对门限附近噪声的抑制',[7]],['施密特触发器','回差宽度 ΔVH=VH−VL',[8]],['施密特触发器','给定分压比例下的对称翻转门限',[9]],\n['单稳态电路','唯一稳态与暂稳态',[10]],['单稳态电路','给定脉宽模型下的 RC 计算',[11]],['单稳态电路','按题设触发边沿产生单个脉冲',[12]],['单稳态电路','重复触发与恢复时间',[13]],\n['多谐振荡器','无稳态与无需外部触发的自激振荡',[14]],['多谐振荡器','RC 定时常数对周期的影响趋势',[15]],['多谐振荡器','方波输出与电容周期充放电读图',[16]],['多谐振荡器','周期与频率换算',[17]],['多谐振荡器','高电平占空比计算',[18]]];\r\n\r\n\nfunction diagram(type,prefix){\n if(!type)return '';\n const id=prefix.replace(/[^A-Za-z0-9_-]/g,'');\n const head=(label,box)=>'\u003cfigure>\u003csvg id=\"'+id+'-svg\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"'+box+'\" role=\"img\" aria-label=\"'+label+'\">\u003cdefs>\u003cmarker id=\"'+id+'-arrow\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\">\u003cpath d=\"M0 0L8 4L0 8Z\" fill=\"#146c59\"/>\u003c/marker>\u003c/defs>\u003cstyle>#'+id+'-svg text{font:16px \"Microsoft YaHei\",sans-serif;fill:#36594a}#'+id+'-svg .axis{fill:none;stroke:#82958a;stroke-width:1.5}#'+id+'-svg .sig{fill:none;stroke:#146c59;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}#'+id+'-svg .in{fill:none;stroke:#aa7950;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}#'+id+'-svg .guide{fill:none;stroke:#b8c4b9;stroke-width:1.2;stroke-dasharray:5 5}#'+id+'-svg .arr{fill:none;stroke:#146c59;stroke-width:2;marker-end:url(#'+id+'-arr \"185\" height=\"92\" rx=\"10\" fill=\"#edf4ec\" stroke=\"#9db8a3\" stroke-width=\"2\"/>\u003ctext x=\"113\" y=\"112\">触发整形\u003c/text>\u003ctext x=\"109\" y=\"139\">与状态控制\u003c/text>\u003crect x=\"340\" y=\"75\" width=\"185\" height=\"92\" rx=\"10\" fill=\"#edf4ec\" stroke=\"#9db8a3\" stroke-width=\"2\"/>\u003ctext x=\"376\" y=\"112\">状态翻转\u003c/text>\u003ctext x=\"378\" y=\"139\">门限判断\u003c/text>\u003crect x=\"340\" y=\"225\" width=\"185\" height=\"70\" rx=\"10\" fill=\"#f8f5ec\" stroke=\"#c8af76\" stroke-width=\"2\"/>\u003ctext x=\"388\" y=\"268\">RC 定时网络\u003c/text>\u003cpath class=\"arr\" d=\"M28 121H72M257 121H340M525 121H666M432 225V167\"/>\u003ctext x=\"10\" y=\"101\">触发\u003c/text>\u003ctext x=\"581\" y=\"105\">输出\u003c/text>\u003ctext class=\"lbl\" x=\"443\" y=\"203\">定时反馈\u003c/text>\u003cpath class=\"axis\" d=\"M90 330V408h570\"/>\u003ctext x=\"23\" y=\"334\">触发\u003c/text>\u003cpath class=\"in\" d=\"M105 365h70v-32h16v32h144v-32h16v32h264\"/>\u003ctext x=\"22\" y=\"386\">输出\u003c/text>\u003cpath class=\"sig\" d=\"M105 398h70v-42h100v42h130v-42h100v42h204\"/>\u003ctext class=\"lbl\" x=\"190\" y=\"351\">tW\u003c/text>\u003cpath class=\"guide\" d=\"M175 326v79M275 350v55M405 350v55M505 350v55\"/>\u003ctext class=\"lbl\" x=\"534\" y=\"429\">时间 →\u003c/text>'+end('功能框图只表达“触发—状态翻转—RC 定时复位”的关系，不指定某一种门级拓扑或触发极性。');\n if(type==='astable')return head('施密特反相器 RC 多谐振荡器连接图及对应时序：输出经电阻反馈到输入，电容对地','0 0 720 620')+'\u003ctext x=\"24\" y=\"42\">RC 自激振荡电路\u003c/text>\u003cpath class=\"axis\" d=\"M95 70V285M95 285H660\"/>\u003cpath d=\"M290 85L290 205L430 145Z\" fill=\"#edf4ec\" stroke=\"#355f4f\" stroke-width=\"2.5\"/>\u003ccircle cx=\"442\" cy=\"145\" r=\"11\" fill=\"#fff\" stroke=\"#355f4f\" stroke-width=\"2.5\"/>\u003ctext x=\"319\" y=\"153\">施密特\u003c/text>\u003ctext x=\"339\" y=\"177\">反相器\u003c/text>\u003cpath class=\"sig\" d=\"M95 145H290M453 145H595V245\"/>\u003cpath class=\"in\" d=\"M595 245V257L583 265L607 273L583 281L607 289L595 297V310H220V145H290\"/>\u003ctext d #cddace;background:#f6f9f5;padding:10pt 12pt;margin:12pt 0}.print-conventions h2{font-size:13pt;margin:0 0 6pt}.print-conventions p{margin:4pt 0;font-size:8.5pt}\r\n@media(max-width:620px){.lesson-card>summary{flex-wrap:nowrap}.lesson-card>summary>span:nth-child(2){min-width:0;flex:1}.lesson-card>summary:after{flex-shrink:0}.lesson-index{width:30px;height:30px}.lesson-table{font-size:11px}.hero h1{font-size:30px}.lesson-content figure{margin:14px 0}.lesson-jumps button{padding:7px 9px;font-size:10px}}\r\n@media print{.diagram-viewport{overflow:visible}.diagram-circuit svg,.diagram-wave svg{min-width:0;max-height:170pt} .print-question figure{max-width:270pt}.print-cover h1{font-size:22pt}.print-section{break-after:avoid}.print-options{display:block}.print-options>div{margin:4pt 0}.print-question{break-inside:avoid}.print-meta{margin-top:4pt}.print-source{word-break:normal}.print-cover p,.print-answer{orphans:2;widows:2}}\r\n@media print{.print-question figure{max-width:360pt}.print-question figure svg{max-height:235pt}.print-question svg .pin{font-size:17px!important}.print-coverage{font-size:8pt;margin:2pt 0;line-height:1.45}.print-source{font-size:7.5pt;line-height:1.4;margin:10pt 0 0}.print-question figcaption{font-size:7pt}}\r\n.lesson-index{grid-template-columns:none}\r\n@media print{.print-coverage-heading{break-before:page}}\r\n\u003c/style>\r\n\u003c/head>\r\n\u003cbody>\r\n\u003cheader class=\"topbar\">\r\n  \u003ca class=\"brand\" href=\"#learn\" aria-label=\"返回知识点汇总\">\u003cspan class=\"brand-symbol\">801\u003c/span>\u003cspan>电子电路\u003cspan class=\"brand-sub\">拓展题库\u003c/span>\u003c/span>\u003c/a>\r\n  \u003cnav class=\"tabs\" aria-label=\"主导航\">\u003cbutton class=\"tab active\" data-view=\"learn\">知识点汇总\u003c/button>\u003cbutton class=\"tab\" data-view=\"practice\">专项练习\u003c/button>\u003cbutton class=\"tab\" data-view=\"coverage\">覆盖清单\u003c/button>\u003cbutton class=\"tab\" data-view=\"guide\">使用说明\u003c/button>\u003c/nav>\r\n  \u003cspan class=\"edition\">数电 · 第二批\u003c/span>\r\n\u003c/header>\r\n\u003cdiv id=\"storage-warning\" class=\"notice\" hidden>当前浏览器无法保存本地进度；关闭页面前可用“导出进度”保存记录。\u003c/div>\r\n\u003csection class=\"hero\">\r\n  \u003cdiv>\u003cdiv class=\"eyebrow\">DIGITAL ELECTRONICS / 02\u003c/div>\u003ch1>555 定时器\u003cspan class=\"hero-dot\">.\u003c/span>\u003c/h1>\u003cp>认门限、看通路，把定时过程算清楚。\u003c/p>\u003cdiv class=\"hero-tags\">\u003cspan>NE555 原理与接法\u003c/span>\u003cspan>路径、波形与简算\u003c/span>\u003cspan>支持离线使用\u003c/span>\u003c/div>\u003c/div>\r\n  \u003cdiv class=\"hero-facts\">\u003cdiv>\u003cstrong>22\u003c/strong>\u003cspan>道精选题\u003c/span>\u003c/div>\u003cdiv>\u003cstrong>5\u003c/strong>\u003cspan>个学习模块\u003c/span>\u003c/div>\u003cdiv>\u003cstrong>8\u003c/strong>\u003cspan>幅原理图解\u003c/span>\u003c/div>\u003c/div>\r\n\u003c/section>\r\n\u003cdiv class=\"app-shell\">\r\n  \u003caside class=\"sidebar\">\r\n    \u003cbutton class=\"learn-entry active\" data-view=\"learn\">\u003cspan>先学\u003c/span> 知识点汇总 →\u003c/button>\r\n    \u003cdiv class=\"side-heading\">练习模块\u003cspan>数电第二批\u003c/span>\u003c/div>\r\n    \u003cdiv id=\"module-list\">\u003c/div>\r\n    \u003cdiv class=\"side-note\">\u003cspan class=\"tiny-label\">本批定位\u003c/span>\u003cp>覆盖引脚、状态、单稳态、双电阻振荡与施密特接法。基础概念、读图和简算循序进行。\u003c/p>\u003c/div>\r\n    \u003cdiv class=\"side-actions\">\u003cbutton id=\"export-btn\">导出进度 ↗\u003c/button>\u003cbutton id=\"import-btn\">导入进度 ↙\u003c/button>\u003c/div>\r\n    \u003cinput id=\"import-file\" type=\"file\" accept=\"application/json,.json\" hidden>\r\n    \u003cp class=\"local-note\">进度保存在当前浏览器；换设备请先导出。\u003c/p>\r\n  \u003c/aside>\r\n  \u003cmain>\r\n    \u003csection id=\"view-learn\" class=\"view\" aria-label=\"知识点汇总\">\r\n      \u003cdiv class=\"section-heading\">\u003cdiv class=\"eyebrow\">LEARN BEFORE PRACTICE\u003c/div>\u003ch2>把 555 看成“门限判断＋状态记忆”\u003c/h2>\u003cp>本批 22 道原创单选题。先认引脚，再沿电容充放电路径分析；波形和公式只对应本页明确画出的接法。\u003c/p>\u003c/div>\n\u003cdiv class=\"lesson-jumps\" aria-label=\"学习模块跳转\">\u003cbutton data-lesson-target=\"learn-1\">01 引脚与基准\u003c/button>\u003cbutton data-lesson-target=\"learn-2\">02 状态判断\u003c/button>\u003cbutton data-lesson-target=\"learn-3\">03 单稳态\u003c/button>\u003cbutton data-lesson-target=\"learn-4\">04 多谐振荡\u003c/button>\u003cbutton data-lesson-target=\"learn-5\">05 施密特接法\u003c/button>\u003cbutton class=\"primary\" data-view=\"practice\">开始练习 →\u003c/button>\u003c/div>\n\u003cdiv class=\"lesson-grid\">\n\u003cdetails class=\"lesson-card\" id=\"learn-1\" open>\u003csummary>\u003cspan class=\"lesson-index\">01\u003c/span>\u003cspan>\u003cb>引脚与内部基准\u003c/b>\u003csmall>8 个引脚，各有明确任务 · 第 1—5 题\u003c/small>\u003c/span>\u003c/summary>\u003cdiv class=\"lesson-content\">\n\u003cp>555 由分压网络、两个比较器、锁存器、放电管和输出级等组成。常见 8 脚封装中，1 脚接地，8 脚接正电源，3 脚输出；2、6 脚分别用来检测低触发与上门限，7 脚控制外部电容放电。\u003c/p>\n\u003cdiv id=\"lesson-pinout\" data-diagram=\"pinout\">\u003c/div>\n\u003cdiv class=\"lesson-table-wrap\">\u003ctable class=\"lesson-table\">\u003cthead>\u003ctr>\u003cth>引脚\u003c/th>\u003cth>功能\u003c/th>\u003cth>分析时抓什么\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1 GND / 8 VCC\u003c/td>\u003ctd>供电参考\u003c/td>\u003ctd>所有电压均相对 1 脚；本批数值题常用 VCC=9 V。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2 TRIG\u003c/td>\u003ctd>低触发\u003c/td>\u003ctd>低于约 VCC/3 可使输出置高。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3 OUT\u003c/td>\u003ctd>输出端\u003c/td>\u003ctd>观察高、低态；高态未必正好等于 VCC。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4 RESET\u003c/td>\u003ctd>低有效复位\u003c/td>\u003ctd>可靠低电平优先强制输出低，放电管导通。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5 CONT\u003c/td>\u003ctd>控制电压\u003c/td>\u003ctd>改变比较基准；未调制时常经小电容旁路。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6 THRES\u003c/td>\u003ctd>上门限检测\u003c/td>\u003ctd>2 脚已解除低触发时，超过约 2VCC/3 使输出复位。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>7 DISCH\u003c/td>\u003ctd>放电端\u003c/td>\u003ctd>输出低时形成到地的低阻通路。\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv id=\"lesson-divider\" data-diagram=\"divider\">\u003c/div>\n\u003cp>默认比较基准约为 VCC/3 与 2VCC/3。5 脚是控制电压端，常经约 10 nF 电容接地以旁路干扰；这个电容不是后面接在定时节点上的主定时电容。4 脚不用复位功能时应保持高电平。\u003c/p>\n\u003cdiv class=\"lesson-example\">\u003cb>例\u003c/b>VCC=9 V 时，默认低触发门限约为 3 V，上门限约为 6 V。4 脚接高只表示解除强制复位，输出仍需由触发、阈值和原状态决定。\u003c/div>\n\u003cbutton class=\"lesson-practice\" data-goto=\"1\">练习第 1—5 题 →\u003c/button>\u003c/div>\u003c/details>\n\n\u003cdetails class=\"lesson-card\" id=\"learn-2\">\u003csummary>\u003cspan class=\"lesson-index\">02\u003c/span>\u003cspan>\u003cb>状态判断：先复位，再看两个门限\u003c/b>\u003csmall>输出状态与放电管联动 · 第 6—8 题\u003c/small>\u003c/span>\u003c/summary>\u003cdiv class=\"lesson-content\">\n\u003cp>以下按默认门限、有效供电、理想静态状态分析，不在恰好等于门限处出题。各行按给定条件分别使用。\u003c/p>\n\u003cdiv class=\"lesson-table-wrap\">\u003ctable class=\"lesson-table\">\u003cthead>\u003ctr>\u003cth>4 脚 RESET\u003c/th>\u003cth>2 脚 TRIG\u003c/th>\u003cth>6 脚 THRES\u003c/th>\u003cth>3 脚输出\u003c/th>\u003cth>放电管\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>可靠低电平\u003c/td>\u003ctd>任意正常输入\u003c/td>\u003ctd>任意正常输入\u003c/td>\u003ctd>低\u003c/td>\u003ctd>导通\u003c/td>\u003c/tr>\u003ctr>\u003ctd>高\u003c/td>\u003ctd>低于 VCC/3\u003c/td>\u003ctd>低于 2VCC/3\u003c/td>\u003ctd>高\u003c/td>\u003ctd>截止\u003c/td>\u003c/tr>\u003ctr>\u003ctd>高\u003c/td>\u003ctd>高于 VCC/3\u003c/td>\u003ctd>高于 2VCC/3\u003c/td>\u003ctd>低\u003c/td>\u003ctd>导通\u003c/td>\u003c/tr>\u003ctr>\u003ctd>高\u003c/td>\u003ctd>高于 VCC/3\u003c/td>\u003ctd>低于 2VCC/3\u003c/td>\u003ctd>保持\u003c/td>\u003ctd>随原状态\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>“保持”来自锁存器。短低脉冲把输出置高后，只要没有阈值复位或强制复位，低触发撤销并不会让输出立即变低。本批不考 TRIG 低与 THRES 高同时提出请求的特殊组合，分析常规电路时按图示有效条件判断。\u003c/p>\n\u003cdiv class=\"lesson-example\">\u003cb>例\u003c/b>VCC=9 V，2 脚=5 V、6 脚=4 V、4 脚为高：两个比较器均不发出翻转请求。原输出高则仍高，原输出低则仍低。\u003c/div>\n\u003cbutton class=\"lesson-practice\" data-goto=\"6\">练习第 6—8 题 →\u003c/button>\u003c/div>\u003c/details>\n\n\u003cdetails class=\"lesson-card\" id=\"learn-3\">\u003csummary>\u003cspan class=\"lesson-index\">03\u003c/span>\u003cspan>\u003cb>单稳态：从约 0 充到 2VCC/3\u003c/b>\u003csmall>一个 R、一个主定时 C · 第 9—13 题\u003c/small>\u003c/span>\u003c/summary>\u003cdiv class=\"lesson-content\">\n\u003cdiv id=\"lesson-mono\" data-diagram=\"mono\">\u003c/div>\n\u003col>\u003cli>\u003cstrong>触发前：\u003c/strong>输出低，放电管导通，定时电容电压接近 0；2 脚由外部保持高电平。\u003c/li>\u003cli>\u003cstrong>有效短低触发：\u003c/strong>2 脚降到约 VCC/3 以下，输出置高，放电管截止。随后 2 脚在定时结束前恢复高电平。\u003c/li>\u003cli>\u003cstrong>暂稳态充电：\u003c/strong>电源经 R 给 C 充电，uC 按指数规律上升，输出维持高。\u003c/li>\u003cli>\u003cstrong>到时：\u003c/strong>uC 达到约 2VCC/3，6 脚使锁存器复位，输出低，7 脚导通使电容迅速放电。\u003c/li>\u003c/ol>\n\u003cdiv id=\"lesson-mono-wave\" data-diagram=\"mono-wave\">\u003c/div>\n\u003cdiv class=\"formula-block\">u\u003csub>C\u003c/sub>(t) = V\u003csub>CC\u003c/sub>[1 − e\u003csup>−t/(RC)\u003c/sup>]\u003cbr>u\u003csub>C\u003c/sub>(t\u003csub>W\u003c/sub>) = 2V\u003csub>CC\u003c/sub>/3\u003cbr>t\u003csub>W\u003c/sub> = RC ln3 ≈ 1.1RC\u003c/div>\n\u003cdiv class=\"lesson-example\">\u003cb>例\u003c/b>R=100 kΩ，C=0.1 μF，则 RC=10 ms，tW≈11 ms。将 C 加倍，理想脉宽也加倍。\u003c/div>\n\u003cdiv class=\"callout\">触发脉冲要足够短，并在定时结束前恢复。主定时 C 与 5 脚的 C5 功能不同；本式不用于上一批任意门电路单稳态的指定模型。\u003c/div>\n\u003cbutton class=\"lesson-practice\" data-goto=\"9\">练习第 9—13 题 →\u003c/button>\u003c/div>\u003c/details>\n\n\u003cdetails class=\"lesson-card\" id=\"learn-4\">\u003csummary>\u003cspan class=\"lesson-index\">04\u003c/span>\u003cspan>\u003cb>多谐振荡：充电经过 RA＋RB，放电经过 RB\u003c/b>\u003csmall>两条路径，分别计时 · 第 14—19 题\u003c/small>\u003c/span>\u003c/summary>\u003cdiv class=\"lesson-content\">\n\u003cdiv id=\"lesson-astable\" data-diagram=\"astable\">\u003c/div>\n\u003cp>2、6 脚一起看电容节点，7 脚接在 RA 与 RB 之间。输出高时，放电管截止，C 经 RA、RB 从电源充电；升到约 2VCC/3，输出翻低，7 脚导通。C 经 RB 放电至约 VCC/3，低触发再次置高，周而复始。\u003c/p>\n\u003cdiv id=\"lesson-astable-wave\" data-diagram=\"astable-wave\">\u003c/div>\n\u003cdiv class=\"formula-block\">t\u003csub>H\u003c/sub> ≈ ln2 · (R\u003csub>A\u003c/sub> + R\u003csub>B\u003c/sub>)C ≈ 0.693(R\u003csub>A\u003c/sub> + R\u003csub>B\u003c/sub>)C\u003cbr>t\u003csub>L\u003c/sub> ≈ ln2 · R\u003csub>B\u003c/sub>C ≈ 0.693R\u003csub>B\u003c/sub>C\u003cbr>T = t\u003csub>H\u003c/sub> + t\u003csub>L\u003c/sub> ≈ 0.693(R\u003csub>A\u003c/sub> + 2R\u003csub>B\u003c/sub>)C\u003cbr>f = 1/T　　D\u003csub>H\u003c/sub> = (R\u003csub>A\u003c/sub> + R\u003csub>B\u003c/sub>)/(R\u003csub>A\u003c/sub> + 2R\u003csub>B\u003c/sub>)\u003c/div>\n\u003cp>为什么是 ln2？充电时距最终值 VCC 的差，从 2VCC/3 缩为 VCC/3；放电时电容电压由 2VCC/3 降到 VCC/3，也正好减半。两段都需要相应时间常数的 ln2 倍。\u003c/p>\n\u003cdiv class=\"lesson-example\">\u003cb>例\u003c/b>RA=10 kΩ、RB=20 kΩ、C=0.1 μF：tH≈2.079 ms、tL≈1.386 ms，T≈3.465 ms，f≈289 Hz，DH≈60%。\u003c/div>\n\u003cdiv class=\"callout\">这些是标准双电阻电路的稳态公式。RA、RB 为正且有限时，DH&gt;50%；不能把 RA 直接短路来追求 50%。二极管分路等改型需另看路径。首次上电从较低电容电压开始的首段充电也不等于稳态 tH。\u003c/div>\n\u003cbutton class=\"lesson-practice\" data-goto=\"14\">练习第 14—19 题 →\u003c/button>\u003c/div>\u003c/details>\n\n\u003cdetails class=\"lesson-card\" id=\"learn-5\">\u003csummary>\u003cspan class=\"lesson-index\">05\u003c/span>\u003cspan>\u003cb>555 施密特接法：输入升高，输出翻低\u003c/b>\u003csmall>2、6 脚并接为输入 · 第 20—22 题\u003c/small>\u003c/span>\u003c/summary>\u003cdiv class=\"lesson-content\">\n\u003cdiv id=\"lesson-schmitt\" data-diagram=\"schmitt\">\u003c/div>\n\u003cp>把 2、6 脚并在一起作为输入 ui：ui 低于约 VCC/3 时输出高；ui 上升越过约 2VCC/3 时输出低；ui 再下降越过约 VCC/3 时输出翻高。两个门限之间保持原状态，因此是\u003cstrong>反相施密特整形\u003c/strong>。\u003c/p>\n\u003cdiv id=\"lesson-schmitt-curve\" data-diagram=\"schmitt-curve\">\u003c/div>\n\u003cdiv class=\"formula-block\">V\u003csub>T+\u003c/sub> ≈ 2V\u003csub>CC\u003c/sub>/3　　V\u003csub>T−\u003c/sub> ≈ V\u003csub>CC\u003c/sub>/3\u003cbr>ΔV = V\u003csub>T+\u003c/sub> − V\u003csub>T−\u003c/sub> ≈ V\u003csub>CC\u003c/sub>/3\u003c/div>\n\u003cdiv class=\"lesson-example\">\u003cb>例\u003c/b>VCC=9 V，输入先为 2 V，再变为 5 V、4 V：最初已把输出置高，后两次仍在 3～6 V 的保持区，输出始终高。若先升到 7 V，再退回 5 V，则会保持低。\u003c/div>\n\u003cbutton class=\"lesson-practice\" data-goto=\"20\">练习第 20—22 题 →\u003c/button>\u003c/div>\u003c/details>\n\u003c/div>\n\u003cdiv class=\"learn-finish\">\u003cp>完成 5 个模块后，做完全部 22 题，再用覆盖清单定位错题。\u003c/p>\u003cbutton class=\"primary\" data-view=\"practice\">开始专项练习 →\u003c/button>\u003c/div>\n\r\n    \u003c/section>\r\n    \u003csection id=\"view-practice\" class=\"view\" hidden>\r\n      \u003cdiv class=\"learning-return\">\u003cspan>遇到没学过的概念，可以随时回来查。\u003c/span>\u003cbutton class=\"text-button\" data-view=\"learn\">← 知识点汇总\u003c/button>\u003c/div>\r\n      \u003cdiv class=\"progress-strip\" aria-label=\"练习进度\">\u003cdiv>\u003cspan>已作答\u003c/span>\u003cstrong id=\"stat-done\">0\u003csmall>/ 22\u003c/small>\u003c/strong>\u003c/div>\u003cdiv>\u003cspan>答对\u003c/span>\u003cstrong id=\"stat-right\">0\u003c/strong>\u003c/div>\u003cdiv>\u003cspan>正确率 · 按已答计\u003c/span>\u003cstrong id=\"stat-rate\">—\u003c/strong>\u003c/div>\u003cdiv>\u003cspan>当前错题\u003c/span>\u003cstrong id=\"stat-wrong\">0\u003c/strong>\u003c/div>\u003cdiv class=\"progress-track\">\u003cdiv class=\"track\">\u003ci id=\"progress-fill\">\u003c/i>\u003c/div>\u003cspan id=\"progress-text\">从第一题开始\u003c/span>\u003c/div>\u003c/div>\r\n      \u003cdiv class=\"toolbar\">\u003cdiv class=\"filter-tabs\" role=\"group\" aria-label=\"题目筛选\">\u003cbutton class=\"filter active\" data-filter=\"all\">全部\u003c/button>\u003cbutton class=\"filter\" data-filter=\"unanswered\">未答\u003c/button>\u003cbutton class=\"filter\" data-filter=\"wrong\">错题\u003c/button>\u003cbutton class=\"filter\" data-filter=\"starred\">收藏\u003c/button>\u003c/div>\u003clabel class=\"search\">\u003cspan>⌕\u003c/span>\u003cinput id=\"search\" type=\"search\" placeholder=\"搜索知识点或题目\" aria-label=\"搜索知识点或题目\">\u003c/label>\u003c/div>\r\n      \u003cdiv class=\"practice-layout\">\u003cdiv id=\"question-area\" aria-live=\"polite\">\u003c/div>\u003caside class=\"question-map\">\u003cdiv class=\"map-title\">题目导航\u003cspan id=\"filtered-count\">\u003c/span>\u003c/div>\u003cdiv class=\"map-legend\">\u003cspan>\u003ci class=\"dot right\">\u003c/i>答对\u003c/span>\u003cspan>\u003ci class=\"dot wrong\">\u003c/i>答错\u003c/span>\u003cspan>☆ 已收藏\u003c/span>\u003c/div>\u003cdiv id=\"question-grid\">\u003c/div>\u003cdiv class=\"map-foot\">\u003cp id=\"module-description\">\u003c/p>\u003cbutton id=\"continue-btn\" class=\"text-button\">跳到下一道未答 →\u003c/button>\u003c/div>\u003c/aside>\u003c/div>\r\n      \u003cdiv class=\"print-bar\">\u003cp>需要纸上练习？题目、图和解析可一起打印。\u003c/p>\u003cdiv>\u003cbutton id=\"print-questions\">打印全部题目\u003c/button>\u003cbutton id=\"print-solutions\">打印题目与解析\u003c/button>\u003c/div>\u003c/div>\r\n    \u003c/section>\r\n    \u003csection id=\"view-coverage\" class=\"view\" hidden>\u003cdiv class=\"section-heading\">\u003cdiv class=\"eyebrow\">COVERAGE MAP\u003c/div>\u003ch2>22 道题，逐项对应知识点\u003c/h2>\u003cp>覆盖清单只统计本批实际考查的内容，不代表命题概率。\u003c/p>\u003c/div>\u003cdiv id=\"coverage-summary\" class=\"coverage-summary\">\u003c/div>\u003cdiv class=\"coverage-table-wrap\">\u003ctable class=\"coverage-table\">\u003cthead>\u003ctr>\u003cth>模块\u003c/th>\u003cth>知识节点\u003c/th>\u003cth>对应题号\u003c/th>\u003cth>已答\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"coverage-body\">\u003c/tbody>\u003c/table>\u003c/div>\u003c/section>\r\n    \u003csection id=\"view-guide\" class=\"view\" hidden>\u003cdiv class=\"section-heading\">\u003cdiv class=\"eyebrow\">SCOPE & CONVENTIONS\u003c/div>\u003ch2>范围、来源与计算约定\u003c/h2>\u003cp>数电第二批 · 555 定时器 · 22 道原创单选题。\u003c/p>\u003c/div>\r\n\u003cdiv class=\"guide-card\">\u003ch3>范围与来源\u003c/h3>\u003cp>本批以常见双极型 8 脚 555 为基础，覆盖内部默认门限、引脚、状态判断，以及标准单稳态、双电阻多谐振荡器和反相施密特接法。技术内容核对 TI 的 NE555 官方数据手册 SLFS022K（2026 年 3 月修订），引脚说明、功能说明和定时应用章节。\u003c/p>\u003cp>深圳大学 2027 年 801 大纲未单列 555 定时器，相关的“非正弦振荡器的识别”列在模拟部分。本批作为既定专项计划的拓展基础，不表示所有题目均为大纲明示考点，也不代表命题预测。\u003c/p>\u003cul class=\"source-list\">\u003cli>\u003ca href=\"https://www.ti.com/lit/ds/symlink/ne555.pdf\" target=\"_blank\" rel=\"noopener\">TI：xx555 Precision Timers 官方数据手册 ↗\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://ehall.szu.edu.cn/gsapp/sys/zsjzapp/index.do#/2027/2/801\" target=\"_blank\" rel=\"noopener\">深圳大学：2027 年 801 电子电路考试大纲 ↗\u003c/a>\u003c/li>\u003c/ul>\u003c/div>\r\n\u003cdiv class=\"guide-card\">\u003ch3>统一约定\u003c/h3>\u003cp>默认有效供电，所有电压以 1 脚为参考；除复位题明确给出低电平外，4 脚保持高电平。5 脚不受外部控制时，上下门限分别近似为 2VCC/3 与 VCC/3。本批不考门限恰好相等的边界，不考相互矛盾的触发与阈值请求组合。\u003c/p>\u003cp>单稳态假定主电容起始电压接近零，触发低脉冲足够短并在定时结束前恢复；多谐振荡器采用图示 RA、RB 均为正的双电阻电路，计算其周期稳态。忽略门限误差、漏电、放电管压降和器件延迟；真实输出高态并不一定等于 VCC。\u003c/p>\u003cdiv class=\"formula-block\">单稳态：t\u003csub>W\u003c/sub>≈RC ln3≈1.1RC\u003cbr>双电阻振荡：t\u003csub>H\u003c/sub>≈0.693(R\u003csub>A\u003c/sub>+R\u003csub>B\u003c/sub>)C，t\u003csub>L\u003c/sub>≈0.693R\u003csub>B\u003c/sub>C\u003cbr>T≈0.693(R\u003csub>A\u003c/sub>+2R\u003csub>B\u003c/sub>)C，f=1/T\u003cbr>D\u003csub>H\u003c/sub>=(R\u003csub>A\u003c/sub>+R\u003csub>B\u003c/sub>)/(R\u003csub>A\u003c/sub>+2R\u003csub>B\u003c/sub>)\u003cbr>施密特回差：ΔV≈V\u003csub>CC\u003c/sub>/3\u003c/div>\u003c/div>\r\n\u003cdiv class=\"guide-card\">\u003ch3>使用、打印与进度\u003c/h3>\u003cp>先学五节讲解，再选答案并核对解析。错题、收藏、模块筛选和关键词搜索可组合使用。键盘支持 1—4 选择，左右方向键切题。精细电路图在窄屏上可左右滑动查看。\u003c/p>\u003cp>打印全部 22 题时可选择学生练习版或含解析版，两者均附知识点覆盖清单。学习记录与第一批独立；换设备或清理浏览数据前导出 JSON。第二批只接受本批的进度备份。\u003c/p>\u003cbutton id=\"reset-btn\" class=\"danger-button\">清空第二批全部进度与收藏\u003c/button>\u003c/div>\u003c/section>\r\n\r\n    \u003cfooter class=\"footer\">\u003cspan>深大 801 · 数电拓展练习 02\u003c/span>\u003cspan>22 道精选 · 第二批 v1.0\u003c/span>\u003c/footer>\r\n  \u003c/main>\r\n\u003c/div>\r\n\u003cdiv id=\"toast\" role=\"status\" hidden>\u003c/div>\u003cdiv id=\"print-root\">\u003c/div>\r\n\u003cscript>const BANK={version:1,edition:'digital-02',title:'555 定时器',subtitle:'深大 801 电子电路 · 数电第二批 · 22 道精选',groups:[\n {id:'A',name:'引脚与内部基准',section:'555 基础',scope:'拓展基础',intro:'认识八个引脚、分压门限、控制端和低有效复位。'},\n {id:'B',name:'状态判断',section:'状态与放电',scope:'拓展基础',intro:'分别判断触发、阈值复位和保持，联系输出与放电管状态。'},\n {id:'C',name:'单稳态定时',section:'单稳态接法',scope:'拓展基础',intro:'沿触发、充电、到时复位的顺序理解约 1.1RC。'},\n {id:'D',name:'多谐振荡器',section:'双电阻振荡',scope:'关联拓展',intro:'沿两条充放电路径求高低电平时间、频率和占空比。'},\n {id:'E',name:'施密特接法',section:'整形与回差',scope:'拓展基础',intro:'把 2、6 脚并作输入，跟踪反相翻转和中间区间的状态保持。'}\n],questions:[]};\nfunction Q(id,group,tag,difficulty,stem,options,answer,explanation,pitfall,fig=''){BANK.questions.push({id,number:id,group,tag,difficulty,stem,options,answer,explanation,pitfall,fig});}\n\nQ(1,'A','默认门限','基础','555 的 VCC=9 V，4 脚保持高电平，5 脚未外加控制电压。采用理想默认门限时，2 脚 TRIG 的低触发门限与 6 脚 THRES 的上门限依次约为',\n ['6 V、3 V','3 V、6 V','4.5 V、4.5 V','0 V、9 V'],1,\n 'B 正确：内部等值分压网络建立约 VCC/3 和 2VCC/3 两个基准，因此分别为 9/3=3 V 和 2×9/3=6 V。A 颠倒了上下门限；C 把它们都当成半电源；D 把电源轨当成比较门限。',\n '这两个数值是默认理想近似；5 脚外加控制电压后，不能仍无条件采用原门限。');\nQ(2,'A','引脚辨识','读图','图为常见 8 引脚 555 的顶视图，缺口朝上。放电端 DISCH 与逻辑输出端 OUT 分别是',\n ['3 脚、7 脚','6 脚、2 脚','5 脚、4 脚','7 脚、3 脚'],3,\n 'D 正确：7 脚 DISCH 连接内部放电管，用来控制外部定时电容放电；3 脚 OUT 为输出端。A 将二者颠倒；B 的 6、2 脚是阈值和触发输入；C 的 5、4 脚分别是控制电压和复位端。',\n '顶视图引脚从缺口左侧的 1 脚起逆时针编号；功能接线图不一定按物理脚位排列。','pinout');\nQ(3,'A','复位优先','理解','555 原来输出高电平。随后 4 脚 RESET 被可靠拉到 0 V，即使 2 脚同时满足低触发条件，忽略传播延迟后，输出和内部放电管应为',\n ['输出低，放电管导通','输出高，放电管截止','继续保持原高电平，放电管不变','输出高，放电管导通'],0,\n 'A 正确：4 脚是低电平有效的复位端，优先于触发和阈值输入。复位有效时，3 脚输出被置低，7 脚经内部放电管形成到地的低阻通路。B、C 忽略复位优先；D 把高输出与正常复位状态错误组合。',\n '4 脚接高电平只表示解除强制复位，并不等于强制输出为高电平。');\nQ(4,'A','控制端与旁路','基础','555 不需要外部调制门限时，5 脚常经约 10 nF 小电容接地。对此最合适的解释是',\n ['把 5 脚直接短接到地，才能建立默认门限','该小电容就是所有接法中的主定时电容','对控制端作交流旁路，减轻干扰；并非将其直流电位钳为 0 V','5 脚是负电源端，只能接地'],2,\n 'C 正确：5 脚是控制电压端，小旁路电容对较快干扰呈较低阻抗，有助于稳定比较基准；电容隔开直流，5 脚仍保有内部基准电位。A 混淆旁路和直流短路；B 混淆控制端旁路电容与外部主定时电容；D 错认引脚功能。',\n '经电容接地与用导线接地不同；主定时电容应按具体电路识别。');\nQ(5,'A','内部组成','基础','从功能结构看，555 完成电压门限判断、状态记忆和定时电容放电控制，主要依靠',\n ['A/D 转换器、计数器和存储器','分压网络、两个比较器、锁存器和放电管','整流桥、变压器和稳压管','一个理想线性放大器和扬声器'],1,\n 'B 正确：分压网络给出基准，两个比较器判断 TRIG、THRES，锁存器记忆状态，放电管控制 7 脚到地通路，再由输出级驱动 3 脚。A 描述另一类数字处理系统；C 是电源环节；D 无法解释两个门限和状态保持。',\n '555 内部同时包含模拟比较与数字状态记忆功能，不能把它只看成一只逻辑门。');\n\nQ(6,'B','低触发与放电管','理解','VCC=9 V，4 脚为高，5 脚采用默认门限。2 脚电压为 2 V、6 脚为 4 V。待状态稳定后，3 脚输出与内部放电管状态为',\n ['低电平、截止','低电平、导通','高电平、截止','高电平、导通'],2,\n 'C 正确：低触发门限为 3 V，2 脚的 2 V 已低于它；6 脚的 4 V 又未超过 6 V 上门限，因此输出置高，内部放电管截止。A、B 错判输出；D 将高输出和放电导通错误配对。',\n '输出置高时，7 脚放电管截止，外部电容才有机会沿接线所提供的路径充电。');\nQ(7,'B','阈值复位','理解','VCC=9 V，4 脚为高，5 脚采用默认门限。2 脚为 5 V，6 脚从 5 V 升到 7 V。忽略延迟后，3 脚输出与内部放电管为',\n ['低电平、导通','高电平、截止','保持原状态，无法判断','高电平、导通'],0,\n 'A 正确：2 脚高于 3 V，不再提出低触发请求；6 脚升至 7 V，超过 6 V 上门限，使锁存器复位，输出低且放电管导通。B 判断反了；C 忽略了明确的阈值越限；D 不符合这一状态的放电控制关系。',\n '判断 6 脚的阈值复位时，也要确认 2 脚已解除低触发，避免混用输入条件。');\nQ(8,'B','中间区间保持','理解','555 的 VCC=9 V、4 脚为高且门限默认。当前输出为高；此时 2 脚=5 V、6 脚=4 V，两个电压随后保持不变。输出应',\n ['立刻变低，因为 2 脚不再低触发','成为 4.5 V 的模拟中间电平','自行产生连续脉冲','保持原高电平'],3,\n 'D 正确：2 脚高于 3 V，未触发置位；6 脚低于 6 V，未触发阈值复位；4 脚也未复位，锁存器保持原状态。A 把触发撤销误作复位；B 把状态保持误作线性输出；C 忽略外部 RC 反馈才可能维持自激振荡。',\n '保持区必须结合此前状态判断；触发信号撤销不意味着输出自动立即变低。');\n\nQ(9,'C','单稳态的稳态','读图','图示 555 单稳态已完成复位并处于触发前稳态，2 脚由外部保持高电平。理想近似下，正确的是',\n ['输出高，电容被持续充到 VCC','输出低，7 脚放电管导通使定时电容电压接近 0','输出低，7 脚悬空而电容电压必为 VCC','无需外部触发也持续振荡'],1,\n 'B 正确：典型单稳态稳态输出低，内部放电管导通，将 6、7 脚相连的定时节点拉近地，电容电压约为零。A、C 错判放电通路；D 把单稳态与无稳态振荡混淆。实际电容残压由放电管压降等因素决定。',\n '单稳态中 6、7 脚接在定时节点，2 脚独立接触发输入；不能误接成多谐振荡器。','mono');\nQ(10,'C','单稳态充电路径','读图','图示单稳态收到有效短低脉冲后进入暂稳态，触发端已恢复高电平。在输出高期间，定时电容 C 主要经哪条路径充电？',\n ['C → 7 脚 → 地','3 脚 OUT → 2 脚 → C','地 → 1 脚 → C','VCC → R → 定时节点 → C → 地'],3,\n 'D 正确：触发后输出高，内部放电管截止，定时电容经外部 R 从 VCC 充电，电压由接近零上升。A 是放电管导通时的放电路径；B 没有题设所示连接；C 不是电源供能的充电回路。',\n '7 脚是受控放电端，3 脚是输出端；不要把外部定时电容想成由 3 脚直接充电。','mono');\nQ(11,'C','到时翻转与触发宽度','理解','典型 555 单稳态由一个足够短的低脉冲触发，且 2 脚在定时结束前已恢复高电平。理想模型中，输出高脉冲正常结束的直接原因是',\n ['定时电容电压升至约 2VCC/3，使阈值比较器复位锁存器','触发低脉冲一结束，输出必立即变低','电容电压恰好达到 VCC/3','定时电容必须充到 VCC 才结束'],0,\n 'A 正确：放电管截止后，电容从约零经 R 充电，升到约 2VCC/3 时 6 脚触发阈值复位，输出变低并重新放电。B 忽略锁存保持；C 混淆触发和阈值门限；D 把充电的最终值当成翻转电压。',\n '约 1.1RC 的定时关系需要触发端及时恢复；若把 2 脚长期拉低，不能直接套用正常脉宽结论。');\nQ(12,'C','单稳态脉宽简算','简算','采用本批图示标准 555 单稳态，默认门限，电容初始电压约 0，触发低脉冲足够短。R=100 kΩ，C=0.1 μF，忽略器件非理想。按 tW≈1.1RC 估算输出高脉宽为',\n ['1.1 ms','6.93 ms','11 ms','110 ms'],2,\n 'C 正确：RC=100×10³×0.1×10⁻⁶ s=10 ms，所以 tW≈1.1×10=11 ms。更精确的理想系数为 ln3≈1.0986。A、D 数量级不对；B 把多谐振荡器中 1/3 到 2/3 电源电压之间的 ln2 系数误用于从零充电的单稳态。',\n '单稳态从约 0 充到 2VCC/3，系数是 ln3；双电阻振荡器的半周期系数是 ln2。');\nQ(13,'C','单稳态参数影响','应用','标准 555 单稳态保持 R、门限、触发条件和其他工作条件不变，只把主定时电容 C 增大为原来的 2 倍。忽略非理想影响，输出高脉宽约',\n ['减半','增大为 2 倍','保持不变','变成由 5 脚旁路电容决定'],1,\n 'B 正确：标准单稳态 tW≈1.1RC，R 和门限不变，C 加倍使同样充电比例所需时间加倍。A 方向相反；C 忽略定时电容；D 把主定时电容和控制端旁路电容混淆。',\n '结论以有效触发、正常复位和电容正常充放电为前提，不能跨故障状态使用。');\n\nQ(14,'D','双电阻接法识别','读图','图示标准 555 电路中，2、6 脚相连，RA 从 VCC 接到 7 脚，RB 从 7 脚接到电容节点。4 脚保持高电平。正常工作时，它主要实现',\n ['无需周期外部触发的多谐振荡','每次外部触发才输出一次的标准单稳态','线性正弦电压放大','交流整流稳压'],0,\n 'A 正确：定时电容反复在约 VCC/3 与 2VCC/3 之间充放电，2、6 脚轮流触发置位和阈值复位，自行维持周期输出。B 不符合该接法；C、D 不是门限控制 RC 电路的功能。',\n '单稳态把 6、7 脚接在同一定时节点；这里是 2、6 脚相连，7 脚位于两个电阻之间。','astable');\nQ(15,'D','充电路径','读图','在图示标准双电阻 555 多谐振荡器中，输出处于高电平且电容正在充电时，主要充电路径为',\n ['电容 → RB → 7 脚 → 地','VCC → RA → 7 脚内部放电管 → 地，电容完全不充电','VCC → RA → RB → C → 地','3 脚 OUT → C → 地'],2,\n 'C 正确：输出高时放电管截止，VCC 经 RA 与 RB 串联向电容充电，故该段时间常数为 (RA+RB)C。A 是另一阶段的放电路径；B 假设放电管仍导通；D 不是图中实际连接。',\n '7 脚处于截止状态不等于 RA、RB 之间断路；外部两电阻仍串联连接。','astable');\nQ(16,'D','放电路径','读图','图示振荡器输出由高变低后，忽略放电管导通压降，定时电容的主要放电路径和对应时间常数为',\n ['C → RA → VCC，时间常数 RAC','C → RA+RB → VCC，时间常数 (RA+RB)C','C → 3 脚 OUT → 地，时间常数为零','C → RB → 7 脚放电管 → 地，时间常数 RBC'],3,\n 'D 正确：输出低时放电管导通，7 脚近似被拉到地，C 经 RB 向该端放电，定时指数的时间常数为 RBC。RA 此时位于 VCC 与 7 脚之间，会流过电源电流，但不串入电容的这条放电路径。A、B、C 均不符实际回路。',\n '电源仍会经 RA 向放电管供电；不能因此把 RA 也加进电容放电时间常数。','astable');\nQ(17,'D','高低电平时间','简算','标准双电阻 555 多谐振荡器中 RA=10 kΩ、RB=20 kΩ、C=0.1 μF。默认门限并忽略非理想，采用 tH≈0.693(RA+RB)C、tL≈0.693RBC。高、低电平时间依次约为',\n ['1.386 ms、2.079 ms','2.079 ms、1.386 ms','0.693 ms、1.386 ms','2.079 ms、2.079 ms'],1,\n 'B 正确：充电高电平时间 tH≈0.693×30 kΩ×0.1 μF=2.079 ms；放电低电平时间 tL≈0.693×20 kΩ×0.1 μF=1.386 ms。A 颠倒高低时间；C 高电平只计算了 RA；D 把 RB 的放电回路误作 RA+RB。',\n '先判定高态对应充电、低态对应放电，再分别选电阻；不要凭对称方波想当然。');\nQ(18,'D','频率简算','简算','仍取标准双电阻振荡器 RA=10 kΩ、RB=20 kΩ、C=0.1 μF，默认门限。由 T≈0.693(RA+2RB)C 估算，输出频率最接近',\n ['289 Hz','28.9 Hz','2.89 kHz','3.47 Hz'],0,\n 'A 正确：RA+2RB=50 kΩ，T≈0.693×50 kΩ×0.1 μF=3.465 ms，f≈1/(3.465×10⁻³)=288.6 Hz，约 289 Hz。B、C 是时间单位或小数位错误；D 把周期的毫秒数误当成频率。',\n '将毫秒换成秒再求倒数；1/(3.465 ms) 不是 1/3.465 Hz。');\nQ(19,'D','占空比与限制','简算','标准双电阻 555 多谐振荡器中 RA=10 kΩ、RB=20 kΩ，未加二极管分流充放电路径。按高电平占空比 DH=tH/T，其近似值及该接法的一般限制为',\n ['40%；RA、RB 均为正时，DH 总小于 50%','50%；只要 RA=RB 就一定严格对称','60%；RA、RB 均为正且有限时，DH 大于 50%','60%；把 RA 直接短路仍可作为正常设计'],2,\n 'C 正确：DH=(RA+RB)/(RA+2RB)=30/50=60%。因 2(RA+RB)>(RA+2RB)，正电阻时高态比低态长。A 算了低电平比例；B 中 RA=RB 时其实为 2/3；D 将放电管导通时的限流电阻短路，不是正常接法。',\n '本限制只适用于图示普通双电阻接法；二极管分路等改型可改变占空比关系。');\n\nQ(20,'E','反相施密特接法','读图','图示 555 的 2、6 脚相连作为输入 ui，4 脚为高，5 脚采用默认门限，7 脚未接外部定时网络。当 ui 从低于 VCC/3 缓慢升到高于 2VCC/3 时，输出最终',\n ['由低变高，是非反相传输','始终等比例跟随 ui','立即形成与 ui 无关的自激振荡','由高变低，形成反相施密特传输'],3,\n 'D 正确：ui 低于 VCC/3 时，2 脚低触发使输出高；ui 上升到超过 2VCC/3 时，6 脚阈值复位使输出低。输入升高而输出降低，因此为反相施密特接法。A 颠倒极性；B 忽略开关输出；C 缺少周期 RC 反馈路径。',\n '第一批的施密特例题可以指定非反相；这里的 555 2、6 脚并接是反相整形。','schmitt');\nQ(21,'E','回差中的历史状态','理解','555 的 VCC=9 V，2、6 脚并接输入 ui，4 脚为高且门限默认。ui 先保持 2 V 足够久，再升到 5 V，最后降到 4 V，均未超过 6 V。输出最终应为',\n ['低电平，因为 5 V 大于低触发门限 3 V','高电平，因为尚未越过上门限使原高态复位','约 4 V，跟随输入','无论历史如何都无法确定'],1,\n 'B 正确：ui=2 V 时已低触发置高；随后 5 V、4 V 均在 3～6 V 保持区，两个比较器都不提出新的状态翻转请求，输出一直保持高。A 把低触发解除误当复位；C 是线性跟随；D 忽略题干已给出的历史。',\n '中间区间的输出取决于历史；题目给出初始越限过程后，就能唯一判断。');\nQ(22,'E','施密特回差','简算','555 采用 2、6 脚并接的施密特接法，VCC=9 V，4 脚为高且 5 脚未受外部控制。理想回差宽度 ΔV 为',\n ['3 V','6 V','9 V','0 V'],0,\n 'A 正确：上门限为 2VCC/3=6 V，下门限为 VCC/3=3 V，故 ΔV=6−3=3 V，也就是 VCC/3。B 把上门限本身当成宽度；C 是整个电源跨度；D 忽略了两个门限不相同。',\n '回差宽度是两个翻转输入电压之差，与输出高低电平的实际摆幅不是同一量。');\n\nconst COVERAGE=[\n ['555 基础','默认 VCC/3 与 2VCC/3 门限及数值',[1]],['555 基础','八脚顶视图，DISCH 与 OUT 的区分',[2]],['555 基础','低有效 RESET 的优先作用',[3]],['555 基础','CONT 旁路与主定时电容的区别',[4]],['555 基础','分压、比较、锁存、放电的功能链',[5]],\n ['状态判断','低触发置高与放电管截止',[6]],['状态判断','阈值越限复位与放电管导通',[7]],['状态判断','保持区需结合原状态',[8]],\n ['单稳态','触发前稳态与电容初始电压',[9]],['单稳态','暂稳态的电源充电路径',[10]],['单稳态','2VCC/3 到时翻转和触发条件',[11]],['单稳态','tW≈ln3·RC≈1.1RC 的计算',[12]],['单稳态','定时电容改变对脉宽的影响',[13]],\n ['多谐振荡','标准 RA、RB、C 接法识别',[14]],['多谐振荡','高态充电经过 RA+RB',[15]],['多谐振荡','低态经 RB 和内部放电管放电',[16]],['多谐振荡','高、低电平时间分别计算',[17]],['多谐振荡','周期合成与频率换算',[18]],['多谐振荡','高电平占空比及大于 50% 的条件',[19]],\n ['施密特接法','2、6 脚并接后的反相特性',[20]],['施密特接法','中间区间的历史状态判断',[21]],['施密特接法','回差宽度 VCC/3 的计算',[22]]\n];\n\r\nfunction diagram(type,prefix){\n if(!type)return '';\n const id=prefix.replace(/[^a-zA-Z0-9_-]/g,'');\n const text=(x,y,s,cl='',anchor='start')=>`\u003ctext x=\"${x}\" y=\"${y}\" class=\"${cl}\" text-anchor=\"${anchor}\">${s}\u003c/text>`;\n const wire=d=>`\u003cpath class=\"wire\" d=\"${d}\"/>`;\n const dot=(x,y)=>`\u003ccircle cx=\"${x}\" cy=\"${y}\" r=\"4\" fill=\"#146c59\"/>`;\n const ground=(x,y)=>wire(`M${x} ${y}v10m-17 0h34m-27 7h20m-14 7h8`);\n const resistor=(x,y,label)=>wire(`M${x} ${y}v12m0 46v12`)+`\u003crect x=\"${x-10}\" y=\"${y+12}\" width=\"20\" height=\"46\" fill=\"#fff\" stroke=\"#36594a\" stroke-width=\"2\"/>`+text(x-20,y+39,label,'','end');\n const cap=(x,y,label)=>wire(`M${x} ${y}v12m-20 0h40m-40 12h40m-20 0v18`)+text(x-28,y+26,label,'','end');\n const pin=(x,y,label,side)=>wire(side==='left'?`M${x-20} ${y}h20`:`M${x} ${y}h20`)+text(side==='left'?x+11:x-11,y+5,label,'pin',side==='left'?'start':'end');\n const chip=()=>`\u003crect x=\"330\" y=\"105\" width=\"230\" height=\"280\" rx=\"10\" fill=\"#edf4ec\" stroke=\"#8fac98\" stroke-width=\"2\"/>`+text(445,245,'555','chip-name','middle');\n const supply=()=>wire('M190 45H485M390 45V105M485 45V105')+dot(390,45)+text(190,30,'VCC')+text(390,129,'8 VCC','pin','middle')+text(485,129,'4 RESET','pin','middle');\n const common=()=>pin(560,185,'3 OUT','right')+wire('M580 185H720')+text(650,170,'uo')+pin(560,330,'5 CONT','right')+wire('M580 330H650V375')+cap(650,375,'C5')+ground(650,417)+text(650,466,'10 nF','small','middle')+text(445,370,'1 GND','pin','middle')+wire('M445 385V425')+ground(445,425);\n const wrap=(body,title,box,caption,kind='circuit')=>`\u003cfigure class=\"diagram-${kind}\">\u003cdiv class=\"diagram-viewport\">\u003csvg id=\"${id}-svg\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"${box}\" role=\"img\" aria-label=\"${title}\">\u003cdefs>\u003cmarker id=\"${id}-arr\" markerWidth=\"7\" markerHeight=\"7\" refX=\"6\" refY=\"3.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\">\u003cpath d=\"M0 0L7 3.5L0 7Z\" fill=\"#146c59\"/>\u003c/marker>\u003c/defs>\u003cstyle>#${id}-svg text{font:16px 'Microsoft YaHei',sans-serif;fill:#36594a}#${id}-svg .pin{font-size:14px}#${id}-svg .small{font-size:13px;fill:#6b8074}#${id}-svg .chip-name{font:bold 27px Georgia,serif;fill:#146c59}#${id}-svg .wire{fill:none;stroke:#36594a;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}#${id}-svg .guide{fill:none;stroke:#b6c6ba;stroke-width:1;stroke-dasharray:5 4}#${id}-svg .sig{fill:none;stroke:#146c59;stroke-width:2.8;stroke-linejoin:round}#${id}-svg .in{fill:none;stroke:#b47f4d;stroke-width:2.5}#${id}-svg .arrow{fill:none;stroke:#146c59;stroke-width:1.6;marker-end:url(#${id}-arr)}\u003c/style>${body}\u003c/svg>\u003c/div>\u003cfigcaption>${caption}\u003c/figcaption>\u003c/figure>`;\n\n if(type==='pinout'){\n  let b=`\u003crect x=\"270\" y=\"65\" width=\"210\" height=\"265\" rx=\"9\" fill=\"#edf4ec\" stroke=\"#8fac98\" stroke-width=\"2\"/>\u003cpath class=\"wire\" d=\"M350 65a25 25 0 0 0 50 0\"/>`+text(375,205,'555','chip-name','middle')+text(375,360,'顶视图 · 缺口朝上','','middle');\n  const left=['1 GND','2 TRIG','3 OUT','4 RESET'],right=['8 VCC','7 DISCH','6 THRES','5 CONT'];\n  for(let i=0;i\u003c4;i++){let y=115+55*i;b+=wire(`M225 ${y}H270M480 ${y}H525`)+text(210,y+5,left[i],'','end')+text(540,y+5,right[i]);}\n  return wrap(b,'8 引脚 555 顶视图：左侧自上向下为1至4，右侧自上向下为8至5','0 0 760 390','常见 8 脚封装顶视图；功能电路图按便于分析的位置排列引脚。');\n }\n if(type==='divider'){\n  let b=wire('M135 45V65')+text(135,30,'VCC','','middle')+resistor(135,65,'R0')+wire('M135 135V165')+resistor(135,165,'R0')+wire('M135 235V265')+resistor(135,265,'R0')+ground(135,335)+wire('M135 150H330M135 250H330')+dot(135,150)+dot(135,250)+text(190,137,'2VCC/3 → 5 CONT')+text(190,276,'VCC/3');\n  b+=`\u003crect x=\"330\" y=\"110\" width=\"165\" height=\"68\" rx=\"8\" fill=\"#edf4ec\" stroke=\"#8fac98\"/>\u003crect x=\"330\" y=\"210\" width=\"165\" height=\"68\" rx=\"8\" fill=\"#edf4ec\" stroke=\"#8fac98\"/>\u003crect x=\"550\" y=\"160\" width=\"165\" height=\"78\" rx=\"8\" fill=\"#edf4ec\" stroke=\"#8fac98\"/>`+text(412,136,'阈值比较','','middle')+text(412,160,'6 THRES','small','middle')+text(412,237,'低触发比较','','middle')+text(412,260,'2 TRIG','small','middle')+text(632,193,'锁存器','','middle')+text(632,218,'输出 / 放电控制','small','middle')+wire('M495 144H525V183H550M495 244H525V218H550')+text(485,336,'4 RESET：低电平强制复位','','middle');\n  return wrap(b,'555 功能示意：三个等值电阻分压给两个比较器提供基准，比较结果控制锁存器','0 0 760 390','功能关系示意，未画比较器晶体管结构；R0 表示内部等值分压电阻。');\n }\n if(type==='mono'){\n  const b=chip()+supply()+common()+resistor(190,80,'R')+wire('M190 45V80M190 150V340M190 265H330M190 305H330M190 340V355')+cap(190,355,'C')+ground(190,397)+dot(190,265)+dot(190,305)+pin(330,265,'6 THRES','left')+pin(330,305,'7 DISCH','left')+pin(330,185,'2 TRIG','left')+wire('M245 185H310')+text(245,164,'触发输入','small')+text(190,245,'uC','small','end')+text(190,466,'主定时电容','','middle');\n  return wrap(b,'标准555单稳态：R从VCC接定时节点，6和7脚接该节点，C接地，2脚独立触发','0 0 760 490','6、7 脚接同一主定时节点；2 脚独立触发。4、8 脚接 VCC；C5 为控制端旁路。');\n }\n if(type==='astable'){\n  const b=chip()+supply()+common()+resistor(190,80,'RA')+wire('M190 45V80M190 150V195M190 175H330')+resistor(190,195,'RB')+wire('M190 265V355M190 325H330M270 325V285H330')+cap(190,355,'C')+ground(190,397)+dot(190,175)+dot(190,325)+dot(270,325)+pin(330,175,'7 DISCH','left')+pin(330,285,'2 TRIG','left')+pin(330,325,'6 THRES','left')+text(178,309,'uC','small','end')+text(190,466,'主定时电容','','middle');\n  return wrap(b,'标准555多谐振荡器：RA从VCC接7脚，RB从7脚接电容节点，2和6脚接电容节点','0 0 760 490','2、6 脚接电容节点；7 脚位于 RA、RB 之间。此图未加改变充放电路径的二极管。');\n }\n if(type==='schmitt'){\n  const b=chip()+supply()+common()+wire('M80 255H220M220 195V305M220 195H330M220 305H330')+dot(220,255)+pin(330,195,'2 TRIG','left')+pin(330,305,'6 THRES','left')+pin(560,285,'7 DISCH','right')+text(610,291,'未使用','small')+text(80,235,'ui');\n  return wrap(b,'555施密特接法：2和6脚并联接输入，7脚不接定时网络，3脚输出','0 0 760 490','2、6 脚并接同一输入；7 脚不外接定时网络。此接法本身不包含自激所需的 RC 反馈。');\n }\n if(type==='mono-wave'){\n  let p='M90 300H170';\n  for(let i=0;i\u003c=100;i++){const t=i/100;p+=`L${170+310*t} ${300-150*(1-Math.exp(-Math.log(3)*t))}`;}\n  p+='L485 297L495 300H675';\n  const b=wire('M90 45V125H690M90 175V310H690M90 350V430H690')+text(16,66,'uTRIG')+text(35,193,'uC')+text(35,366,'uo')+`\u003cpath class=\"in\" d=\"M90 70H170V110H190V70H675\"/>\u003cpath class=\"sig\" d=\"${p}\"/>\u003cpath class=\"sig\" d=\"M90 420H170V365H480V420H675\"/>\u003cpath class=\"guide\" d=\"M90 200H675M170 45V430M480 45V430\"/>`+text(97,190,'2VCC/3','small')+text(97,292,'0','small')+text(170,452,'t0','small','middle')+text(480,452,'t0+tW','small','middle')+text(675,452,'t','small')+text(280,395,'高态持续 tW','small');\n  return wrap(b,'555单稳态时序：短低触发后电容从0指数充电至2VCC/3，输出高脉冲结束并迅速放电','0 0 760 475','理想模型：触发低脉冲在到时前恢复；uC 按指数曲线充电，随后快速放电。输出只标高/低态。','wave');\n }\n if(type==='astable-wave'){\n  const h=180,l=120,base=100;let p=`M${base} 250`;\n  for(let cycle=0;cycle\u003c2;cycle++){\n   const start=base+cycle*(h+l);\n   for(let i=0;i\u003c=80;i++){const f=i/80,u=1-(2/3)*Math.exp(-Math.log(2)*f);p+=`L${start+h*f} ${340-270*u}`;}\n   for(let i=0;i\u003c=80;i++){const f=i/80,u=(2/3)*Math.exp(-Math.log(2)*f);p+=`L${start+h+l*f} ${340-270*u}`;}\n  }\n  const b=wire('M90 95V285H720M90 330V430H720')+`\u003cpath class=\"guide\" d=\"M90 160H710M90 250H710M100 95V430M280 95V430M400 95V430M580 95V430M700 95V430\"/>\u003cpath class=\"in\" d=\"${p}\"/>\u003cpath class=\"sig\" d=\"M100 350H280V410H400V350H580V410H700\"/>`+text(25,115,'uC')+text(25,346,'uo')+text(100,148,'2VCC/3','small')+text(100,276,'VCC/3','small')+text(170,337,'tH','small')+text(325,397,'tL','small')+text(455,468,'T = tH + tL','small')+text(695,450,'t','small');\n  return wrap(b,'555多谐振荡器稳态波形：电容在1/3和2/3电源电压间指数充放电，充电时输出高','0 0 760 490','稳态示例取 RA:RB=1:2，所以高态占 60%；首次上电的起始充电不按该稳态半周期计。','wave');\n }\n if(type==='schmitt-curve'){\n  const b=wire('M90 55V330H700')+text(40,65,'uo')+text(700,355,'ui')+`\u003cpath class=\"guide\" d=\"M250 115V330M470 115V330\"/>\u003cpath class=\"in\" d=\"M115 115H470V275H670\"/>\u003cpath class=\"sig\" d=\"M670 275H250V115H1 .slice(0,40):''};\r\n    }\r\n  }\r\n  if (Array.isArray(raw.stars)) result.stars = [...new Set(raw.stars.filter(id=>byId.has(id)))];\r\n  if (byId.has(raw.current)) result.current=raw.current;\r\n  return result;\r\n}\r\ntry {\r\n  const saved=localStorage.getItem(KEY);\r\n  state=cleanRecord(JSON.parse(saved));\r\n} catch(e) { storageAvailable=false; }\r\nfunction save() {\r\n  try { localStorage.setItem(KEY,JSON.stringify(state)); storageAvailable=true; } catch(e) { storageAvailable=false; }\r\n  $('#storage-warning').hidden=storageAvailable;\r\n}\r\nfunction toast(message) { $('#toast').textContent=message; $('#toast').hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(()=>$('#toast').hidden=true,3500); }\r\nfunction filtered() {\r\n  return BANK.questions.filter(q=>{\r\n    const a=state.answers[q.id];\r\n    return (moduleId==='all'||q.group===moduleId) &&\r\n      (filter==='all'||filter==='unanswered'&&!a||filter==='wrong'&&a&&!a.correct||filter==='starred'&&state.stars.includes(q.id)) &&\r\n      (!query||[q.stem,q.tag,q.number,...q.options].join(' ').toLowerCase().includes(query.toLowerCase()));\r\n  });\r\n}\r\nfunction renderModules() {\r\n  $('#module-list').innerHTML = `\u003cbutton class=\"module-btn ${moduleId==='all'?'active':''}\" data-module=\"all\">\u003cspan class=\"module-letter\">∑\u003c/span>\u003cspan class=\"module-info\">全部模块\u003csmall>基础概念与一步简算\u003c/small>\u003c/span>\u003cspan class=\"module-number\">${TOTAL}\u003c/span>\u003c/button>` + BANK.groups.map(g=>`\u003cbutton class=\"module-btn ${moduleId===g.id?'active':''}\" data-module=\"${g.id}\">\u003cspan class=\"module-letter\">${g.id}\u003c/span>\u003cspan class=\"module-info\">${esc(g.name)}\u003csmall>${g.scope==='拓展'?'选学 · 关联拓展':g.scope+' · '+g.section}\u003c/small>\u003c/span>\u003cspan class=\"module-number\">${BANK.questions.filter(q=>q.group===g.id).length}\u003c/span>\u003c/button>`).join('');\r\n}\r\nfunction renderStats() {\r\n  const answers=Object.values(state.answers),right=answers.filter(a=>a.correct).length;\r\n  $('#stat-done').innerHTML=`${answers.length}\u003csmall>/ ${TOTAL}\u003c/small>`;\r\n  $('#stat-right').textContent=right;\r\n  $('#stat-rate').textContent=answers.length?Math.round(right/answers.length*100)+'%':'—';\r\n  $('#stat-wrong').textContent=answers.length-right;\r\n  $('#progress-fill').style.width=answers.length/TOTAL*100+'%';\r\n  $('#progress-text').textContent=answers.length===TOTAL?`${TOTAL} 道精选题已全部作答`:answers.length?`已完成 ${Math.round(answers.length/TOTAL*100)}% · 按自己的节奏继续`:'从第一题开始';\r\n}\r\nfunction renderQuestion(list, preserve) {\r\n  if(!preserve&&!list.some(q=>q.id===state.current)) state.current=list[0]?.id??null;\r\n  const q=byId.get(state.current);\r\n  if(!q) { $('#question-area').innerHTML='\u003cdiv class=\"empty-state\">\u003cdiv class=\"eyebrow\">NO MATCHES\u003c/div>\u003ch2>这里暂时没有题目\u003c/h2>\u003cp>可切换模块、清除搜索，或选择其他筛选条件。\u003c/p>\u003cbutton id=\"clear-filter\" class=\"primary\">显示全部题目\u003c/button>\u003c/div>'; return; }\r\n  const a=state.answers[q.id],choice=a?.choice??draft[q.id],group=BANK.groups.find(g=>g.id===q.group),idx=list.findIndex(item=>item.id===q.id),starred=state.stars.includes(q.id);\r\n  $('#question-area').innerHTML=`\u003carticle class=\"question-card\" data-question-id=\"${q.id}\">\u003cdiv class=\"question-top\">\u003cdiv class=\"question-meta\">\u003cspan class=\"badge \">${group.section+' · '+q.tag}\u003c/span>\u003cspan class=\"badge level\">${q.difficulty}\u003c/span>\u003c/div>\u003cbutton class=\"star-button ${starred?'on':''}\" id=\"star-question\" aria-pressed=\"${starred}\" aria-label=\"${starred?'取消收藏':'收藏本题'}\">${starred?'★':'☆'}\u003c/button>\u003c/div>\u003cdiv class=\"question-body\">\u003cdiv class=\"question-id\">QUESTION ${String(q.number).padStart(2,'0')} / ${TOTAL}\u003c/div>\u003ch2 class=\"stem\">${rich(q.stem)}\u003c/h2>${diagram(q.fig,'q'+q.id)}\u003cdiv class=\"options\" role=\"group\" aria-label=\"选择答案\">${q.options.map((o,i)=>`\u003 rrent?'aria-current=\"true\"':''}>${String(q.number).padStart(2,'0')}\u003c/button>`;}).join('');\r\n  $('#module-description').textContent=moduleId==='all'?'按五个模块学习，或从题号直接跳转。计算条件以题干和对应接法为准。':BANK.groups.find(g=>g.id===moduleId).intro;\r\n}\r\nfunction renderCoverage() {\r\n  const complete=COVERAGE.filter(row=>row[2].every(id=>state.answers[id])).length;\r\n  $('#coverage-summary').innerHTML=`知识节点已全部作答 \u003cb>${complete} / ${COVERAGE.length}\u003c/b> · 这里只统计本批精选内容`;\r\n  $('#coverage-body').innerHTML=COVERAGE.map(row=>`\u003ctr class=\"${row[0]==='关联拓展'?'opt-row':''}\">\u003ctd>${row[0]}\u003c/td>\u003ctd>${esc(row[1])}\u003c/td>\u003ctd>${row[2].map(id=>`\u003cbutton class=\"qid-link\" data-goto=\"${id}\" aria-label=\"练习第${byId.get(id).number}题\">${String(byId.get(id).number).padStart(2,'0')}\u003c/button>`).join('')}\u003c/td>\u003ctd>${row[2].filter(id=>state.answers[id]).length} / ${row[2].length}\u003c/td>\u003c/tr>`).join('');\r\n}\r\nfunction render(preserve=false) {\r\n  const list=filtered();\r\n  renderModules(); renderStats(); renderQuestion(list,preserve); renderMap(list); renderCoverage();\r\n  $$('.filter').forEach(b=>b.classList.toggle('active',b.dataset.filter===filter));\r\n  $('#storage-warning').hidden=storageAvailable;\r\n}\r\nfunction switchView(name) {\r\n  if(!['learn','practice','coverage','guide'].includes(name))return;\r\n  view=name;\r\n  $$('.view').forEach(el=>el.hidden=el.id!=='view-'+name);\r\n  $$('.tab, .learn-entry').forEach(b=>{b.classList.toggle('active',b.dataset.view===name);b.setAttribute('aria-pressed',String(b.dataset.view===name));});\r\n  $$('.module-btn').forEach(b=>b.classList.toggle('active',view==='practice'&&b.dataset.module===moduleId));\r\n}\r\nfunction openLesson(id) {\r\n  const lesson=document.getElementById(id);\r\n  if(!lesson||!lesson.classList.contains('lesson-card'))return;\r\n  switchView('learn');lesson.open=true;\r\n  lesson.scrollIntoView({block:'start'});lesson.querySelector('summary').focus({preventSc
