uto-fit,minmax(min(100%,220px),1fr));gap:9px;margin:14px 0 22px}\n.batch-card{display:flex;flex-direction:column;align-items:flex-start;gap:5px;width:100%;min-width:0;padding:14px 16px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);text-align:left;cursor:pointer}\n.batch-card>span{font-size:12px;line-height:1.4;color:var(--muted)}\n.batch-card>b{font-size:16px;line-height:1.45;overflow-wrap:anywhere}\n.batch-card>small{font-size:12px;line-height:1.4;color:var(--muted)}\n.batch-card:hover{border-color:#afcbbb;background:#fbfdfa}\n.batch-card.active{border-color:#a9cbb7;background:var(--mint);box-shadow:inset 0 0 0 1px #d0e3d5}\n.diagram-viewport{scrollbar-width:thin;scrollbar-color:#9aada4 #e8ede7;overscroll-behavior-inline:contain}\n.diagram-viewport::-webkit-scrollbar{height:8px}\n.diagram-viewport::-webkit-scrollbar-track{background:#e8ede7;border-radius:4px}\n.diagram-viewport::-webkit-scrollbar-thumb{background:#9aada4;border:2px solid #e8ede7;border-radius:4px}\n@media(max-width:600px){.batch-index{grid-template-columns:minmax(0,1fr);gap:7px}.batch-card{padding:12px 14px}}\n@media(max-width:600px){.diagram-figure figcaption::after{content:\"　↔\";color:var(--teal);font-size:14px}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cheader class=\"topbar\">\n  \u003ca class=\"brand\" href=\"#learn\" aria-label=\"返回知识点汇总\">\u003cspan class=\"brand-symbol\">801\u003c/span>\u003cspan>电子电路\u003cspan class=\"brand-sub\">拓展题库\u003c/span>\u003c/span>\u003c/a>\n  \u003cnav class=\"tabs\" aria-label=\"主导航\">\u003cbutton class=\"tab active\" data-view=\"learn\">知识点汇总\u003c/button>\u003cbutton class=\"tab\" data-view=\"practice\">专项练习\u003c/button>\u003cbutton class=\"tab\" data-view=\"coverage\">覆盖清单\u003c/button>\u003cbutton class=\"tab\" data-view=\"guide\">范围说明\u003c/button>\u003c/nav>\n  \u003cspan class=\"edition\">数电 · 第三至六批\u003c/span>\n\u003c/header>\n\u003cdiv id=\"storage-warning\" class=\"notice\" hidden>当前浏览器无法保存进度；关闭页面前请导出记录。\u003c/div>\n\u003csection class=\"hero\">\n  \u003cdiv>\u003cdiv class=\"eyebrow\">DIGITAL ELECTRONICS / BATCH 03—06\u003c/div>\u003ch1>从数模转换到逻辑实现\u003cspan class=\"hero-dot\">.\u003c/span>\u003c/h1>\u003cp>四批基础拓展练习，按专题学习与复习。\u003c/p>\u003cdiv class=\"hero-tags\">\u003cspan>D/A 与 A/D\u003c/span>\u003cspan>存储器与接口\u003c/span>\u003cspan>PLD、HDL 与逻辑系列\u003c/span>\u003c/div>\u003c/div>\n  \u003cdiv class=\"hero-facts\">\u003cdiv>\u003cstrong>4\u003c/strong>\u003cspan>个批次\u003c/span>\u003c/div>\u003cdiv>\u003cstrong>11\u003c/strong>\u003cspan>个学习主题\u003c/span>\u003c/div>\u003cdiv>\u003cstrong>40\u003c/strong>\u003cspan>道精选题\u003c/span>\u003c/div>\u003c/div>\n\u003c/section>\n\u003cdiv class=\"app-shell\">\n  \u003caside class=\"sidebar\">\n    \u003cbutton class=\"learn-entry active\" data-view=\"learn\">\u003cspan>先学\u003c/span> 知识点汇总 →\u003c/button>\n    \u003cdiv class=\"side-heading\">练习批次\u003cspan>03—06\u003c/span>\u003c/div>\n    \u003cdiv id=\"module-list\">\u003c/div>\n    \u003cdiv class=\"side-note\">\u003cspan class=\"tiny-label\">选题范围\u003c/span>\u003cp>按既定专项计划选择基础概念、简单读图和一步计算，不要求覆盖整章内容。\u003c/p>\u003c/div>\n    \u003cdiv class=\"side-actions\">\u003cbutton id=\"export-btn\">导出进度 ↗\u003c/button>\u003cbutton id=\"import-btn\">导入进度 ↙\u003c/button>\u003c/div>\n    \u003cinput id=\"import-file\" type=\"file\" accept=\"application/json,.json\" hidden>\n    \u003cp class=\"local-note\">进度保存在本机浏览器；换设备请先导出。\u003c/p>\n  \u003c/aside>\n  \u003cmain>\n    \u003csection id=\"view-learn\" class=\"view\" aria-label=\"知识点汇总\">\n      \u003cdiv class=\"learn-intro\">\n        \u003cdiv class=\"eyebrow\">LEARN FIRST / DIGITAL ELECTRONICS\u003c/div>\n        \u003ch2>先建立概念，再练典型小题。\u003c/h2>\n        \u003cp class=\"learn-lead\">第三批从转换分辨率讲起；第四批读存储组织；第五批认识毛刺、异步状态和总线；第六批读懂可编程逻辑与简单 HDL。每节配有对应题目和易混提醒。\u003c/p>\n        \u003cdiv class=\"learn-route\">\u003cspan>03 转换\u003c/span>\u003ci>→\u003c/i>\u003cspan>04 存储器\u003c/span>\u003ci>→\u003c/i>\u003cspan>05 时序与接口\u003c/span>\u003ci>→\u003c/i>\u003cspan>06 可编程逻辑\u003c/span>\u003c/div>\n        \u003cdiv class=\"learn-intro-bottom\">\u003cp>按批次进入学习，或从目录直达某个知识点。\u003c/p>\u003cbutton id=\"start-practice\" class=\"primary\" data-view=\"practice\">开始练习 →\u003c/button>\u003c/div>\n      \u003c/div>\n      \u003cdiv id=\"batch-index\" class=\"batch-index\">\u003c/div>\n      \u003cdiv id=\"batch-practice-links\" class=\"lesson-practice\">\u003cspan>直接进入练习\u003c/span>\u003cbutton data-practice-batch=\"A\">第三批练习\u003c/button>\u003cbutton data-practice-batch=\"B\">第四批练习\u003c/button>\u003cbutton data-practice-batch=\"C\">第五批练习\u003c/button>\u003cbutton data-practice-batch=\"D\">第六批练习\u003c/button>\u003c/div>\n      \u003cdiv id=\"lesson-index\" class=\"lesson-index\">\u003c/div>\n      \u003cdiv id=\"lesson-container\">\u003c/div>\n    \u003c/section>\n    \u003csection id=\"view-practice\" class=\"view\" hidden>\n      \u003cdiv class=\"learning-return\">\u003cspan>可随时返回对应知识点复习。\u003c/span>\u003cbutton class=\"text-button\" data-view=\"learn\">← 知识点汇总\u003c/button>\u003c/div>\n      \u003cdiv class=\"progress-strip\" aria-label=\"练习进度\">\u003cdiv>\u003cspan>已作答\u003c/span>\u003cstrong id=\"stat-done\">0\u003csmall>/ 40\u003c/small>\u003c/strong>\u003c/div>\u003cdiv>\u003cspan>答对\u003c/span>\u003cstrong id=\"stat-right\">0\u003c/strong>\u003c/div>\u003cdiv>\u003cspan>正确率\u003c/span>\u003cstrong id=\"stat-rate\">—\u003c/strong>\u003c/div>\u003cdiv>\u003cspan>当前错题\u003c/span>\u003cstrong id=\"stat-wrong\">0\u003c/strong>\u003c/div>\u003cdiv class=\"progress-track\">\u003cdiv class=\"track\">\u003ci id=\"progress-fill\">\u003c/i>\u003c/div>\u003cspan id=\"progress-text\">从第一题开始\u003c/span>\u003c/div>\u003c/div>\n      \u003cdiv class=\"toolbar\">\u003cdiv class=\"filter-tabs\" role=\"group\" aria-label=\"题目筛选\">\u003cbutton class=\"filter active\" data-filter=\"all\">全部\u003c/button>\u003cbutton class=\"filter\" data-filter=\"unanswered\">未答\u003c/button>\u003cbutton class=\"filter\" data-filter=\"wrong\">错题\u003c/button>\u003cbutton class=\"filter\" data-filter=\"starred\">收藏\u003c/button>\u003c/div>\u003clabel class=\"search\">\u003cspan>⌕\u003c/span>\u003cinput id=\"search\" type=\"search\" placeholder=\"搜索知识点或题目\" aria-label=\"搜索知识点或题目\">\u003c/label>\u003c/div>\n      \u003cdiv class=\"practice-layout\">\u003cdiv id=\"question-area\" aria-live=\"polite\">\u003c/div>\u003caside class=\"question-map\">\u003cdiv class=\"map-title\">题目导航\u003cspan id=\"filtered-count\">\u003c/span>\u003c/div>\u003cdiv class=\"map-legend\">\u003cspan>\u003ci class=\"dot right\">\u003c/i>答对\u003c/span>\u003cspan>\u003ci class=\"dot wrong\">\u003c/i>答错\u003c/span>\u003cspan>☆ 已收藏\u003c/span>\u003c/div>\u003cdiv id=\"question-grid\">\u003c/div>\u003cdiv class=\"map-foot\">\u003cp id=\"module-description\">\u003c/p>\u003cbutton id=\"continue-btn\" class=\"text-button\">下一道未答 →\u003c/button>\u003c/div>\u003c/aside>\u003c/div>\n    \u003c/section>\n    \u003csection id=\"view-coverage\" class=\"view\" hidden>\u003cdiv class=\"section-heading\">\u003cdiv class=\"eyebrow\">COVERAGE MAP\u003c/div>\u003ch2>四批精选知识点\u003c/h2>\u003cp>每题都对应一个实际纳入的知识节点；清单用于复习，不代表命题概率。\u003c/p>\u003c/div>\u003cdiv id=\"coverage-summary\" class=\"coverage-summary\">\u003c/div>\u003cdiv class=\"coverage-table-wrap\">\u003ctable class=\"coverage-table\">\u003cthead>\u003ctr>\u003cth>批次与模块\u003c/th>\u003cth>知识节点\u003c/th>\u003cth>题号\u003c/th>\u003cth>已答\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"coverage-body\">\u003c/tbody>\u003c/table>\u003c/div>\u003c/section>\n    \u003csection id=\"view-guide\" class=\"view\" hidden>\n      \u003cdiv class=\"section-heading\">\u003cdiv class=\"eyebrow\">SCOPE & SOURCES\u003c/div>\u003ch2>范围与编题说明\u003c/h2>\u003cp>数电第三至第六批 · 基础拓展合集 · 40 道原创四选一题。\u003c/p>\u003c/div>\n      \u003cdiv class=\"guide-card\">\u003ch3>批次范围\u003c/h3>\u003cp>第三批：D/A与A/D转换；第四批：存储器；第五批：竞争冒险、异步时序与接口；第六批：可编程逻辑、简单HDL、ECL与Bi-CMOS。\u003c/p>\u003cp>题量分别为10、8、12、10道，根据选入的基础知识节点确定。内容以概念、功能识别、简单逻辑读图和一步计算为主；复杂器件误差分析、异步竞态消除、完整HDL状态机与器件设计不纳入。\u003c/p>\u003cp>这些主题按既定专项计划编写，部分属于课程延伸，不应据此推断为深圳大学801官方考纲明示范围。本合集为原创学习材料，不是官方试题，也不代表命题预测。\u003c/p>\u003cul class=\"source-list\">\u003cli>\u003ca href=\"https://ehall.szu.edu.cn/gsapp/sys/zsjzapp/index.do#/2027/2/801\" target=\"_blank\" rel=\"noopener\">深圳大学 2027 年 801 电子电路考试大纲 ↗\u003c/a>\u003c/li>\u003c/ul>\u003c/div>\n      \u003cdiv class=\"guide-card\">\u003ch3>本批统一约定\u003c/h3>\u003cp>DAC 与 ADC 数值题会在题干给出码值、参考电压或量程约定；地址容量题明确采用 1K=1024。异步时序问题仅考识别与基本器件行为；具体接口有效电平、逻辑门限及器件能力以题干和数据手册为准。\u003c/p>\u003cdiv class=\"formula-block\">n 位可表示 2ⁿ 个数字码\u003cbr>本批单极性 DAC 题：Vout = VREF·D / 2ⁿ\u003cbr>本批均匀 ADC 题：1 LSB = 量程 / 2ⁿ\u003cbr>k 根地址线：2ᵏ 个可选地址\u003cbr>存储总容量：字数 × 字长（bit）\u003c/div>\u003cp>练习先选答案，再查看解析和易错提醒。题目可按批次筛选、关键词检索、收藏或集中复习错题。作答进度保存在当前浏览器，可导出 JSON 备份。\u003c/p>\u003cbutton id=\"reset-btn\" class=\"danger-button\">清空本合集进度与收藏\u003c/button>\u003c/div>\n    \u003c/section>\n    \u003cfooter class=\"footer\">\u003cspan>深大 801 · 数电拓展练习 03—06\u003c/span>\u003cspan>40 道基础精选 · v1.0\u003c/span>\u003c/footer>\n  \u003c/main>\n\u003c/div>\n\u003cdiv id=\"toast\" role=\"status\" hidden>\u003c/div>\u003cdiv id=\"print-root\">\u003c/div>\n\u003cscript>const BANK={version:1,edition:'digital-03-06',title:'数电第三至六批',subtitle:'深大 801 电子电路 · 基础拓展合集',groups:[\n {id:'A',batch:3,name:'D/A 与 A/D 转换',section:'数模转换与模数转换',scope:'基础精选',intro:'从量化位数、分辨率和转换步骤入手，完成短小的比例计算。'},\n {id:'B',batch:4,name:'存储器',section:'半导体存储器基础',scope:'基础精选',intro:'读懂字数、位数、地址线，辨别常见存储器与控制信号。'},\n {id:'C',batch:5,name:'竞争冒险、异步时序与接口',section:'逻辑电路与接口基础',scope:'基础精选',intro:'识别传播延迟造成的毛刺，理解锁存、三态总线和开集电极。'},\n {id:'D',batch:6,name:'可编程逻辑、HDL 与 ECL/Bi-CMOS',section:'可编程器件与逻辑系列',scope:'基础精选',intro:'认识 PLD、读懂几行组合逻辑 HDL，并比较常见逻辑系列特点。'}\n],questions:[]};\nfunction Q(id,group,lesson,tag,difficulty,stem,options,answer,explanation,pitfall,fig=''){\n BANK.questions.push({id,number:id,group,lesson,tag,difficulty,stem,options,answer,explanation,pitfall,fig});\n}\n\nQ(1,'A','learn-A1','转换方向','基础','D/A 转换器的主要作用是',\n ['把模拟量变成二进制码','把电压变成电流而不需要数字输入','把数字码转换成对应的模拟电压或电流','把交流信号整流成直流'],2,\n 'C 正确：DAC 接收数字码，并按参考量和码值给出模拟电压或电流。A 描述 ADC；B 只描述一种模拟转换器；D 是整流功能。',\n '看到 D/A 先记“数字输入、模拟输出”，不要按字母顺序猜转换方向。');\nQ(2,'A','learn-A1','码数','基础','理想 n 位二进制转换器可表示的不同数字码共有',\n ['n 种','2n 种','n² 种','2ⁿ 种'],3,\n 'D 正确：每一位有 0、1 两种状态，n 位共有 2×2×…×2=2ⁿ 种组合。A、B、C 都不是逐位二进制组合数。',\n 'n 位的码数是 2 的 n 次方，不是 2n 或 n 的平方。');\nQ(3,'A','learn-A1','DAC 权重','理解','采用单极性理想 DAC 的约定 Vout=VREF·D/2ⁿ，D 表示无符号整数码值。若位数 n 和码值 D 不变，只把 VREF 加倍，Vout 将',\n ['减半','加倍','不变','变成 2ⁿ 倍'],1,\n 'B 正确：输出与参考电压成正比，VREF 加倍使 Vout 加倍。A 把比例方向倒置；C 忽略参考电压；D 把位数对应的码数误当作参考电压倍率。',\n '计算前先确认采用哪一种 DAC 满量程约定；本题公式已在题干给定。');\nQ(4,'A','learn-A1','DAC 一步计算','简算','一个 4 位单极性理想 DAC 满足 Vout=VREF·D/16。VREF=5 V，输入码 1010₂ 时，输出为',\n ['1.5625 V','2.500 V','3.125 V','5.000 V'],2,\n 'C 正确：1010₂=10，Vout=5×10/16=3.125 V。A 少乘了码值；B 把 4 位最大码附近的比例算错；D 是参考电压，不是码1010的输出。',\n '先把二进制码换成整数，再代入题给分母 2ⁿ；不要把 1010₂ 当成十进制1010。');\nQ(5,'A','learn-A1','R-2R 梯形网络','基础','常见 R-2R 梯形 DAC 只使用哪两种标称电阻值构成重复网络？',\n ['R 与 2R','R、2R 与 4R','C 与 2C','任意递增的 2ⁿR'],0,\n 'A 正确：R-2R 网络由 R 和 2R 两种阻值构成，便于集成电路中保持电阻比例。B、D 错把每一位都配不同阻值；C 是电容网络。',\n 'R-2R 的关键是只有两种电阻比例；不要把二进制权重直接等同于一串精密电阻。');\n\nQ(6,'A','learn-A2','ADC 步骤','基础','典型 ADC 将连续变化的输入转换成数字码。下列概念顺序最恰当的是',\n ['编码 → 采样 → 量化','量化 → 编码 → 采样','采样 → 量化 → 编码','采样 → 编码 → 量化'],2,\n 'C 正确：先在时间上取得样值，再将幅度归入离散量化等级，最后用二进制码表示等级。A、B、D 至少有两个环节次序错误。',\n '采样处理时间离散，量化处理幅度离散，编码才把量化等级写成位串。');\nQ(7,'A','learn-A2','采样定理','理解','若输入是最高频率为 1 kHz 的理想带限信号，为避免混叠，均匀采样频率应',\n ['低于 1 kHz','恰好等于 1 kHz','高于 1 kHz 但低于 2 kHz','高于 2 kHz'],3,\n 'D 正确：理想带限信号需满足采样频率大于最高频率的两倍，本题应高于 2 kHz。A、B、C 都低于该条件。真实系统还要考虑抗混叠滤波和实现余量。',\n '采样频率不足会产生混叠；实际设计通常留有余量，而不是卡在理论下限。');\nQ(8,'A','learn-A2','ADC 码数','基础','一个理想 8 位 ADC 能区分的数字输出码共有',\n ['8 个','16 个','128 个','256 个'],3,\n 'D 正确：8 位共有 2⁸=256 种二进制码。A 把位数当作码数；B 是 4 位的码数；C 少算了一倍。',\n '码数是 0 到 255 共 256 个，不是只数到最大码值255就结束。');\nQ(9,'A','learn-A2','ADC 的 LSB','简算','理想 8 位 ADC 的输入范围为 0 至 5.00 V，并按 2⁸ 个等宽量化区间定义 1 LSB。其量化步长约为',\n ['1.95 mV','19.53 mV','39.06 mV','256 mV'],1,\n 'B 正确：1 LSB=5/256 V≈0.01953 V=19.53 mV。A 小了十倍；C 大了两倍；D 把位数与电压量程混为一谈。',\n '题干若用 2ⁿ 个量化区间，步长就是量程除以 2ⁿ；满刻度端点约定需另行说明。');\nQ(10,'A','learn-A2','分辨率与精度','理解','对理想 n 位 ADC 而言，“分辨率”主要说明',\n ['输入阻抗有多高','转换结果最多能分成多少个离散码级','实际误差一定为零','转换速度有多快'],1,\n 'B 正确：位数决定可用数字码级数，2ⁿ 位数越多，量化步长通常越小。A 是输入特性；C 把量化分辨能力误当成实际精度；D 是速度指标。',\n '位数和分辨率不等于实际准确度；偏移、增益、噪声等也会造成误差。');\n\nQ(11,'B','learn-B1','存储组织','基础','一个容量标成 2K×8 的存储器，通常表示',\n ['2K 个地址，每个地址存 8 位','8 个地址，每个地址存 2K 位','总共只有 16 位','2K 个字节地址，且数据宽度不确定'],0,\n 'A 正确：前面的 2K 表示 2K 个字（可寻址单元），×8 表示每个字宽 8 位。B 把字数与字长颠倒；C 忽略了 2K 个字；D 漏掉了明确给出的字长。',\n '容量标记的“×”左边是字数，右边是每字位数；先确认题目采用的 K 定义。');\nQ(12,'B','learn-B1','地址线数','简算','若存储器按字寻址，具有 12 根地址输入线，则最多可选择多少个不同地址？',\n ['12 个','24 个','1024 个','4096 个'],3,\n 'D 正确：12 位地址的组合数为 2¹²=4096。A、B 直接拿线数计算；C 是 10 根地址线的容量。',\n '地址线条数决定可编码地址数，记作 2ᵏ；不要与数据线条数混淆。');\nQ(13,'B','learn-B1','容量计算','简算','把 4K 理解为 4096 个字，容量为 4K×8 的存储器总容量为',\n ['4 KiB','8 KiB','16 KiB','32 KiB'],0,\n 'A 正确：4096×8=32768 bit，除以每字节8 bit得4096 byte，即4 KiB。B 把位数换算多乘了2；C、D 的总位数更大。',\n '先算总 bit，再除以8换成 byte；本题明确采用 1K=1024。');\nQ(14,'B','learn-B1','地址与数据端口','基础','在一个普通并行存储器中，地址输入和数据输入/输出端主要分别用于',\n ['数据输入选择读写时刻；地址端传送数据','选择要访问的字；传送该字的内容','选择供电电压；设置刷新周期','设置逻辑门延迟；选择芯片封装'],1,\n 'B 正确：地址端选择字，数据端承载被读出或写入的位。A 把两类端口职责互换；C、D 与端口功能无关。',\n '存储器地址表示“哪一个位置”，数据表示“该位置中的内容”。');\nQ(15,'B','learn-B2','ROM 与 RAM','基础','对常见半导体存储器的一般分类，哪项最合适？',\n ['ROM 通常可按规定读写，RAM 只能永久保存','RAM 通常支持随机读写且断电会失去数据；ROM 通常断电保持内容','ROM 和 RAM 都一定需要刷新','RAM 只允许顺序访问，ROM 只能并行访问'],1,\n 'B 正确：这里的 RAM 指常见易失性随机存取存储器，通常可读写并在断电后失去数据；ROM 主要用于断电保持内容。A、D 颠倒概念；C 把 DRAM 特性泛化到 ROM。',\n '“随机存取”指可按地址选择访问，不代表随机数；不同非易失 RAM 器件需按型号区分。');\nQ(16,'B','learn-B2','SRAM 与 DRAM','理解','相较于常见 SRAM，常见 DRAM 的典型维护要求是',\n ['需要周期刷新以维持存储信息','每次读出后都必须更换存储芯片','断电后自动转成 ROM','不允许按地址读出'],0,\n 'A 正确：DRAM 用电容存储状态，电荷会泄漏，因此需要周期刷新；SRAM 通常不需这种刷新。B、C、D 都不是 DRAM 的属性。',\n '“不需要刷新”不等于 SRAM 断电仍保存数据；两者通常都属于易失性存储器。');\nQ(17,'B','learn-B2','存储控制信号','基础','当片选 CS 未有效时，常见存储器芯片通常应',\n ['仍强制向数据总线输出全部存储内容','忽略本次访问，避免与其他芯片同时响应','自动擦除当前地址','自动刷新所有地址并锁定总线'],1,\n 'B 正确：片选用于指定参与访问的芯片；未选中时一般不响应读写，数据端常处于高阻或无效状态。A 会造成总线冲突；C、D 都不是片选功能。',\n 'CS 的有效电平由具体芯片决定；先看信号名上的反相标记或数据手册。');\nQ(18,'B','learn-B2','位扩展','应用','若要把字数不变、数据宽度由 8 位扩成 16 位，可用两片相同存储器并行组成。正确做法是',\n ['让两片接收相同地址，各自提供 8 个不同数据位','串接两片地址线，一片只处理偶数地址','把一片设为只读，另一片设为只写','把两片的同名输出直接短接在一起'],0,\n 'A 正确：两片共享地址和读写控制，各自承担数据字的一半，合成16位字。B 改变地址组织而非位宽；C 不能形成正常读写；D 会造成输出争用。',\n '位扩展增加每个字的位数；字数扩展则需要额外地址译码或片选。');\n\nQ(19,'C','learn-C1','传播延迟','基础','组合逻辑中，输入变化后不同逻辑路径的传播延迟不完全相同，可能使输出短暂出现非预期脉冲。这种现象称为',\n ['量化误差','存储刷新','竞争冒险','三态关断'],2,\n 'C 正确：信号沿多条延迟不同的路径传播并在逻辑门处重新汇合时，可能短暂毛刺，即竞争冒险。A 属于模数转换；B 属于 DRAM；D 是接口输出状态。',\n '毛刺可能很短，但如果后级把它当作时钟或触发信号，仍可能影响电路。','hazard');\nQ(20,'C','learn-C1','静态 1 冒险','读图','组合逻辑函数 Y=AB + A̅C 中，B=C=1，输入 A 改变。理想逻辑输出应保持为 1，但由于路径延迟不同，可能短暂变为 0。这属于',\n ['静态 1 冒险','静态 0 冒险','动态冒险','存储器读冲突'],0,\n 'A 正确：输出应一直保持逻辑1却短暂掉到0，称静态1冒险；该表达式的两条乘积项通过 A 与 A̅ 两条不同路径切换。B 指输出应保持0却出现1；C 指应单次翻转却多次跳变；D 与存储器无关。',\n '识别静态冒险要先看理想输出应保持 0 还是 1，再判断实际毛刺方向。','hazard');\nQ(21,'C','learn-C1','毛刺用途','理解','异步复位端通常对输入脉冲敏感。若组合逻辑毛刺误送到异步复位端，最可能的风险是',\n ['不会有影响，因为毛刺不是完整时钟周期','某个触发器可能被意外复位','存储器自动扩展位宽','DAC 输出分辨率提高'],1,\n 'B 正确：异步控制端不等待时钟沿，足够宽或满足器件脉宽条件的毛刺可能造成误动作。A 忽略异步输入；C、D 与复位无关。',\n '毛刺是否会触发取决于脉宽与器件规格；题目考风险识别，不作具体时序保证。','hazard');\nQ(22,'C','learn-C2','静态 0 冒险','理解','静态 0 冒险的典型表现是',\n ['输出本应一直为 0，却短暂跳到 1','输出本应一直为 1，却短暂掉到 0','输出本应翻转一次，却连续翻转多次','输入一直不变而输出必然振荡'],0,\n 'A 正确：静态0冒险是在理想输出应保持低电平时，因路径延迟差短暂出现高脉冲。B 描述静态1冒险；C 描述动态冒险；D 把延迟毛刺误说成必然振荡。',\n '名称中的“0”描述应保持的逻辑值，而不是毛刺的实际电平。','hazard-wave');\nQ(23,'C','learn-C2','冒险消除','基础','在 Y=AB + A̅C 中，若 B=C=1 时 A 改变，为覆盖两项之间的过渡，可加入哪个冗余项来消除这一静态 1 冒险？',\n ['A+B','A̅+C','BC','B̅C̅'],2,\n 'C 正确：加入 BC 后，B=C=1 时这条项保持为1，不依赖 A 的两条延迟路径。A、B 不能保证该输入条件下输出保持1；D 在 B=C=1 时为0。该项按共识定理不改变原逻辑功能。',\n '冗余项可改善瞬态覆盖，但必须验证新增逻辑没有改变稳态真值表。','hazard');\nQ(24,'C','learn-C3','异步与同步','基础','与同步时序电路相比，异步时序电路的状态改变通常',\n ['只允许在统一时钟有效沿发生','可由输入变化直接引起，不依赖统一时钟沿','没有任何状态记忆','一定不受传播延迟影响'],1,\n 'B 正确：异步电路没有统一时钟作为全部状态更新的基准，输入事件可直接引起状态改变。A 描述同步电路；C 忽略了“时序”意味着有状态；D 与异步电路对延迟更敏感的事实相反。',\n '异步表示状态更新不由统一时钟沿统一控制，不代表电路没有延迟。');\nQ(25,'C','learn-C3','锁存器与触发器','基础','电平敏感锁存器与边沿触发 D 触发器的主要区别是',\n ['锁存器在使能电平有效期间可跟随输入；触发器主要在指定时钟边沿采样','锁存器没有状态记忆；触发器只能存模拟量','两者都必须连续改变输出','锁存器只用于地址线，触发器只用于数据线'],0,\n 'A 正确：锁存器对一段有效电平透明，边沿触发器在指定时钟沿更新状态。B、C、D 都与基本时序器件功能不符。',\n '判断“电平敏感”还是“边沿触发”，看控制条件而不是器件引脚数量。');\nQ(26,'C','learn-C3','异步控制端','理解','带低有效异步清零端的 D 触发器，其清零端被拉低时，通常',\n ['立即将 Q 清零，不必等待时钟沿','只在下一个时钟上升沿清零','把 D 输入锁存到 Q','令 Q 与时钟同频振荡'],0,\n 'A 正确：异步清零对时钟无关，低有效时在有效条件下直接把状态置0。B 把异步端误当同步控制；C 是数据采样；D 不是清零功能。',\n '异步端撤销时仍需满足器件的恢复/移除时间要求；本题只判断有效期间的逻辑作用。');\nQ(27,'C','learn-C4','三态输出','基础','数字总线接口中的三态输出状态通常指',\n ['高电平、低电平和高阻态','0、1 和不确定的随机码','读、写和刷新','正相、反相和延迟'],0,\n 'A 正确：三态驱动器可输出0、输出1，或进入高阻态 Z 以暂时断开总线。B 把高阻误当随机逻辑值；C 是存储控制动作；D 是信号处理概念。',\n 'Z 不是第三种可计算的逻辑码；它表示该输出暂时不主动驱动线路。','bus');\nQ(28,'C','learn-C4','总线争用','理解','两个三态器件同时连接同一条总线，若一个主动输出0、另一个主动输出1，可能发生',\n ['总线争用，电平不确定并可能产生较大电流','自动形成正确的逻辑与','总线进入可靠高阻态','仅使地址线数量翻倍'],0,\n 'A 正确：相反电平的输出级同时驱动同一节点会争用，逻辑值不可靠且可能增加电流。B 把推挽输出误当开集电极；C 只有两者都关闭才可能高阻；D 与总线宽度无关。',\n '共享总线必须保证同一时刻至多一个推挽输出使能。','bus');\nQ(29,'C','learn-C4','开集电极接口','基础','开集电极输出要可靠地产生高电平，常需外接上拉电阻；多路输出在满足条件下并接时，可形成',\n ['有线与功能','模拟加法器','动态刷新存储器','三态时钟源'],0,\n 'A 正确：开集电极输出只能主动拉低，释放时由上拉电阻产生高电平；多个输出并接可实现有线与（按正逻辑描述）。B、C、D 都不是该接口的作用。',\n '未接上拉时，释放态没有确定的高电平；不能把开集电极当作推挽输出。','bus');\nQ(30,'C','learn-C4','低有效控制','理解','存储器接口的输出使能信号名为 /OE，斜线表示低有效。此时要让数据输出驱动总线，通常应使 /OE',\n ['保持高电平','变为低电平','与地址线短接','改作时钟输入'],1,\n 'B 正确：/OE 的斜线表示低电平有效，所以拉低时允许输出。A 是无效状态；C、D 都会破坏接口用途。片选也必须同时满足器件要求。',\n '信号名前的横线、斜线或泡泡通常表示反相/低有效；最终仍应核对具体芯片手册。');\n\nQ(31,'D','learn-D1','PLD 功能','基础','可编程逻辑器件（PLD）的主要用途是',\n ['通过配置内部可编程资源实现所需数字逻辑功能','把所有逻辑功能永久限定为放大模拟信号','只存放普通文件，不参与逻辑运算','替代全部时钟和电源电路'],0,\n 'A 正确：PLD 允许设计者配置逻辑与连接，完成组合或时序数字功能。B 是模拟放大器；C 把可编程逻辑误作通用文件存储；D 夸大了器件作用。',\n 'PLD 是实现数字逻辑的器件类别，不是某一种固定功能逻辑门。','pld');\nQ(32,'D','learn-D1','PLA 与 PAL','理解','对经典 PLA 和 PAL 结构的简化描述，哪项正确？',\n ['PLA 的与阵列和或阵列均可编程；PAL 通常是可编程与阵列、固定或阵列','PLA 和 PAL 的所有阵列都不可编程','PAL 只能实现模拟滤波','PLA 的输入端必须接外部存储器'],0,\n 'A 正确：经典结构区别在可编程阵列的组合方式；PLA 两级阵列均可编程，PAL 的或阵列通常固定。B 与“可编程”矛盾；C、D 无关。',\n '这里讨论经典阵列结构；实际产品系列可能加入寄存器、宏单元等资源。','pld');\nQ(33,'D','learn-D1','FPGA 结构','基础','FPGA 常见的可编程资源主要包括',\n ['可配置逻辑块、可编程互连和输入/输出资源','只有一组固定的与非门','机械继电器和电容阵列','专用 DAC 和功率变压器'],0,\n 'A 正确：用户逻辑由可配置逻辑块实现，并通过可编程互连连接到输入输出。B 描述固定门电路；C、D 不是 FPGA 的基本结构。',\n '“现场可编程”指器件在制造后可由用户配置，不代表任意电气条件下都可改写。','pld');\nQ(34,'D','learn-D2','HDL 用途','基础','硬件描述语言（HDL）主要用于',\n ['描述数字电路的结构或行为，供仿真、综合等工具处理','按普通脚本顺序逐行运行并取代实体电路','直接描述电阻的模拟噪声而无需模型','只书写芯片封装的机械尺寸'],0,\n 'A 正确：HDL 用文本表达硬件逻辑关系或时序行为，可用于仿真和综合。B 把并行硬件描述误成普通顺序程序；C、D 不是其主要用途。',\n 'HDL 的语句常表示并行存在的电路关系；不能把代码行顺序直接等同于硬件执行先后。','hdl');\nQ(35,'D','learn-D2','连续赋值','读代码','在简化 Verilog 组合逻辑中，`assign y = a & b;` 表示',\n ['y 是 a 与 b 的按位与结果，并随输入变化更新','只有时钟上升沿到来时 y 才更新','把 a 与 b 存进 ROM','令 y 永远为高阻态'],0,\n 'A 正确：连续赋值描述组合关系，a 或 b 变化时 y 按逻辑与更新。B 描述边沿触发存储；C、D 与这条表达式无关。',\n '题目把信号作为单比特处理；向量信号的 `&` 通常作按位与。','hdl');\nQ(36,'D','learn-D2','逻辑表达式读码','简算','若 a=1、b=1、c=0，组合表达式 `y = (a & b) | c` 的结果 y 为',\n ['0','1','Z','无法判断，因为没有时钟'],1,\n 'B 正确：a&b=1，1|0=1。A 漏掉了与项；C 把普通逻辑表达式误作三态控制；D 误以为组合逻辑必须有时钟。',\n '先算括号中的与，再算或；没有时钟的组合函数也能确定输出。','hdl');\nQ(37,'D','learn-D2','组合逻辑覆盖','理解','在用过程块描述组合逻辑时，若某些输入条件下没有给输出赋新值，综合工具可能推断出',\n ['锁存器以保持原值','一个理想 DAC','地址译码器必然扩位','异步时钟倍频器'],0,\n 'A 正确：未赋值的分支需要保留先前输出，可能推断锁存器。B、C、D 都不是缺少组合赋值时的常见结果。给所有输入分支赋值可避免这种意外存储。',\n '写组合逻辑时检查所有分支；有意使用存储行为时应明确表达时序意图。','hdl');\nQ(38,'D','learn-D3','ECL 特点','基础','ECL 逻辑常用于强调高速的场合，其典型特点是',\n ['晶体管尽量避免深度饱和以缩短开关时间，但功耗通常较高','必须依靠刷新电容保存每个逻辑门输出','只能使用高阻态，不能输出0或1','速度很慢但完全没有静态功耗'],0,\n 'A 正确：避免晶体管进入深饱和可减少存储电荷和关断延迟，ECL 因而能高速工作，但通常有较大静态功耗。B 描述 DRAM 的刷新；C、D 都不符合其逻辑功能和功耗特征。',\n 'ECL 的高速优势通常伴随功耗和电源设计代价，不能只记“快”。','families');\nQ(39,'D','learn-D3','CMOS 与 Bi-CMOS','理解','Bi-CMOS 集成工艺的基本含义是',\n ['在同一芯片工艺中结合双极型器件与 CMOS 器件','把所有晶体管都改成电容','把 ROM 与 RAM 简单并联','只用 ECL 门而不使用 CMOS'],0,\n 'A 正确：Bi-CMOS 将双极型晶体管与 CMOS 器件结合，可按需要利用不同器件的驱动、速度或集成特性。B、C、D 都不是该名称的含义。',\n '具体速度、功耗和成本取决于工艺与产品；不能仅凭名称断言所有指标都更优。','families');\nQ(40,'D','learn-D3','逻辑系列取舍','应用','比较 ECL 与 CMOS 逻辑系列时，哪项一般性判断较合理？',\n ['ECL 常以较高功耗换取高速；CMOS 通常具有较低静态功耗和较高集成度','ECL 和 CMOS 的速度、功耗在所有器件中都完全相同','CMOS 输出不能表示逻辑0','ECL 是一种存储器地址编码'],0,\n 'A 正确：这是两类逻辑系列常见的总体取舍；实际器件仍要查数据手册。B 忽略系列差异；C 否认 CMOS 的基本逻辑功能；D 把逻辑电路与编码概念混淆。',\n '逻辑系列特征是总体趋势，不代表不同代际、负载条件下的所有器件都相同。','families');\n\nconst LESSONS=[\n ['转换基础','learn-A1','DAC：数字码如何变成模拟量','DAC 把一个有限位数的二进制码映射成模拟电压或电流。理想单极性模型常把无符号码值 D 按参考电压缩放；本节题目统一在题干给出使用的满量程约定。',[\n  'n 位共有 2ⁿ 个数字码','本批计算约定：Vout = VREF·D / 2ⁿ','R-2R 梯形网络只需 R、2R 两种阻值'\n ],[1,2,3,4,5],'4 位码 1010₂ 对应 D=10；若 VREF=5 V，按题设约定输出为 5×10/16=3.125 V。','不同教材或器件会用不同满刻度定义；先按题目给出的公式与参考端点计算。'],\n ['转换基础','learn-A2','ADC：采样、量化、编码','ADC 将连续模拟输入表示成数字码。采样把时间变成离散时刻；量化把幅值归入有限等级；编码再用二进制位表示等级。位数决定码数和理想步长，但不单独保证实际准确度。',[\n  '流程：采样 → 量化 → 编码','理想 n 位码数：2ⁿ','本批量程约定：LSB = 量程 / 2ⁿ','理想带限信号：fs > 2fmax 可避免混叠'\n ],[6,7,8,9,10],'0—5 V、8 位、按 256 个等宽区间量化时，1 LSB=5/256 V≈19.53 mV。','分辨率是能分出多细的码级；准确度还受偏移、增益、噪声和非线性等因素影响。'],\n ['存储器','learn-B1','存储组织：字数、字长与地址','并行存储器通常由地址端选择一个字，由数据端输入或输出该字。容量标记 M×N 表示 M 个字、每字 N 位；若有 k 根二进制地址线，最多编码 2ᵏ 个地址。',[\n  'k 根地址线 → 2ᵏ 个地址','M×N 的总位数 = M·N bit','1 byte = 8 bit；本批 1K=1024'\n ],[11,12,13,14],'4K×8 表示 4096 个 8 位字：总容量 32768 bit = 4096 byte = 4 KiB。','不要把字数和字长颠倒，也不要忘记把 bit 除以 8 才换成 byte。'],\n ['存储器','learn-B2','常见存储器与访问控制','常见 RAM 可按地址随机读写，通常断电失去数据；ROM 类存储器用于断电保持内容。SRAM 通常不需周期刷新，DRAM 需要刷新。片选、读使能和输出使能的有效电平要看具体器件标记。',[\n  'RAM：常见类型可读写、易失','DRAM：需刷新；SRAM：通常无需刷新','位扩展：共享地址，让多片共同组成更宽数据字'\n ],[15,16,17,18],'两片 2K×8 芯片共用地址与控制，各负责 8 位数据，便可组成 2K×16 的字宽。','RAM 不代表“所有类型都易失”；非易失 RAM 等器件需按器件类别和数据手册判断。'],\n ['时序基础','learn-C1','传播延迟与逻辑毛刺','组合逻辑的各条路径存在传播延迟。输入变化时，较快与较慢路径到达门电路的时刻不同，输出可能短暂偏离理想真值。毛刺是瞬态现象，不会改变稳定后的逻辑真值。',[\n  '原因：多条路径延迟不同','静态冒险：输出理论上应保持不变','异步控制端或时钟端可能对毛刺敏感'\n ],[19,20,21],'Y=AB+A̅C 中，B=C=1 时理想输出始终为1；A 的两条路径延迟不同可能造成短暂低脉冲。','不能只看稳态真值表就认为毛刺无害；后级敏感输入可能把毛刺识别成事件。','hazard'],\n ['时序基础','learn-C2','冒险类型与冗余项','静态1冒险会在应保持1时短暂降为0；静态0冒险会在应保持0时短暂升为1。动态冒险则是在理想情况下只应翻转一次时，实际输出出现多次跳变。特定两级逻辑可用共识项补足过渡路径。',[\n  '静态 1：1 → 短暂 0 → 1','静态 0：0 → 短暂 1 → 0','动态：一次翻转附近出现多次跳变','Y=AB+A̅C 可加入共识项 BC'\n ],[22,23],'若 B=C=1，冗余项 BC 在 A 切换时仍为1，可为静态1过渡提供连续覆盖。','消除冒险的项必须保持逻辑等价；不能为了看起来平滑而随意改真值表。','hazard-wave'],\n ['时序基础','learn-C3','异步状态与锁存器','异步时序电路没有统一时钟沿来同步所有状态更新；输入事件可直接影响状态。锁存器是电平敏感存储器件，边沿触发 D 触发器则主要在指定时钟边沿采样。异步清零/置位也可越过时钟直接控制状态。',[\n  '同步状态更新：受统一时钟沿控制','异步状态更新：输入事件可直接触发','锁存器看有效电平；D 触发器看时钟边沿'\n ],[24,25,26],'低有效异步清零被拉低时，Q 直接清零，不需要等待下一个时钟沿。','异步输入更容易受毛刺与时序约束影响；实际释放时需满足恢复时间等规格。','async'],\n ['接口基础','learn-C4','共享总线与输出使能','多个器件可共用数据总线，但应使用片选或输出使能控制驱动状态。三态输出可为0、1或高阻 Z；同一时刻只能由允许的驱动器控制共享线路。开集电极输出通过上拉电阻获得高电平。',[\n  '三态：0、1、Z（高阻）','推挽输出不能同时驱动相反电平','开集电极：主动拉低，释放时由上拉提供高电平'\n ],[27,28,29,30],'当一个器件输出、其余器件置于 Z 时，指定器件可以控制总线；若两个器件相反驱动，就会发生争用。','Z 表示输出暂时不主动驱动，并不代表线路上必然为0或1。','bus'],\n ['可编程逻辑','learn-D1','PLD、PLA、PAL 与 FPGA','PLD 通过用户配置的逻辑资源和连接来实现数字功能。经典 PLA 的与阵列和或阵列都可编程；经典 PAL 通常可编程与阵列、固定或阵列。FPGA 由可配置逻辑块、互连和输入输出资源组成。',[\n  'PLD：配置硬件逻辑功能','PLA：与、或阵列均可编程','PAL：经典结构中或阵列通常固定','FPGA：逻辑块 + 可编程互连 + I/O'\n ],[31,32,33],'若需要改变逻辑功能，PLD 可通过更新配置来实现；实际产品资源与配置方式依器件系列而定。','不同年代的 PLD 家族结构差异很大；本批只考经典阵列概念和 FPGA 基本组成。','pld'],\n ['硬件描述语言','learn-D2','读懂几行组合逻辑 HDL','HDL 用文本表达硬件结构或行为。连续赋值可直接表达组合逻辑关系，输入变化时输出随逻辑式更新。仿真用于观察模型行为，综合工具则把受支持的描述映射成硬件资源。',[\n  '`assign y = a & b;`：组合与逻辑','`(a & b) | c`：先与后或','组合描述要覆盖所有输入情况，避免意外保持旧值'\n ],[34,35,36,37],'a=1、b=1、c=0 时，(a&b)|c=(1&1)|0=1。','HDL 不是普通脚本；不完整的组合赋值可能推断出锁存器。','hdl'],\n ['逻辑系列','learn-D3','ECL 与 Bi-CMOS 的基本取舍','ECL 通过避免晶体管深度饱和获得较快开关速度，通常伴随较高静态功耗。Bi-CMOS 在同一集成工艺中结合双极型与 CMOS 器件，可按电路需要利用不同器件特点。具体指标取决于器件和工艺。',[\n  'ECL：强调高速，通常功耗较高','CMOS：通常静态功耗较低、集成度高','Bi-CMOS：集成双极型器件与 CMOS 器件'\n ],[38,39,40],'选择逻辑系列时要结合速度、功耗、负载、电源与工艺；“更快”不等于所有指标更好。','这些是常见总体特点，不是对每个具体器件的绝对保证。','families']\n];\n\nconst COVERAGE=[\n ['D/A 转换','DAC 方向与输入输出',[1]],['D/A 转换','n 位二进制码数',[2]],['D/A 转换','参考电压与码值的比例关系',[3]],['D/A 转换','4 位 DAC 的一步换算',[4]],['D/A 转换','R-2R 两种阻值',[5]],\n ['A/D 转换','采样、量化、编码的顺序',[6]],['A/D 转换','奈奎斯特采样条件与混叠',[7]],['A/D 转换','8 位 ADC 的数字码数',[8]],['A/D 转换','量程、位数与 LSB',[9]],['A/D 转换','分辨率和实际准确度的区别',[10]],\n ['存储器组织','字数、字长与容量标记',[11]],['存储器组织','地址线数与可选地址数',[12]],['存储器组织','bit、byte 与容量换算',[13]],['存储器组织','地址端和数据端的作用',[14]],['存储器类型','常见 RAM 与 ROM 的区别',[15]],['存储器类型','SRAM、DRAM 与刷新',[16]],['存储器接口','片选与未选中状态',[17]],['存储器扩展','共享地址进行位扩展',[18]],\n ['竞争冒险','传播延迟与输出毛刺',[19]],['竞争冒险','静态 1 冒险条件',[20]],['竞争冒险','异步控制端受到毛刺影响',[21]],['竞争冒险','静态 0 冒险',[22]],['竞争冒险','SOP 共识项的过渡覆盖',[23]],['异步时序','同步与异步状态更新',[24]],['异步时序','电平锁存与边沿触发',[25]],['异步时序','异步清零优先于时钟',[26]],\n ['接口','三态输出 Z',[27]],['接口','共享总线输出争用',[28]],['接口','开集电极与上拉电阻',[29]],['接口','低有效输出使能',[30]],\n ['可编程逻辑','PLD 的可配置逻辑用途',[31]],['可编程逻辑','经典 PLA 与 PAL 阵列结构',[32]],['可编程逻辑','FPGA 的逻辑块与互连',[33]],['HDL','HDL 描述与普通程序的区别',[34]],['HDL','连续赋值与组合逻辑',[35]],['HDL','布尔表达式求值',[36]],['HDL','不完整赋值与锁存器推断',[37]],['逻辑系列','ECL 的高速与功耗取舍',[38]],['逻辑系列','Bi-CMOS 的工艺含义',[39]],['逻辑系列','CMOS、ECL 的总体特点',[40]]\n];\n\nconst DIAGRAMS={\n dac:{label:'数码经过DAC映射为模拟输出',view:'0 0 620 220',caption:'功能框图。实际 DAC 可输出电压或电流，比例和端点由器件定义。',svg:'\u003cdefs>\u003cmarker id=\"dac-arrow\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\">\u003cpath d=\"M0 0L8 4L0 8Z\" fill=\"#286b72\"/>\u003c/marker>\u003c/defs>\u003ctext x=\"30\" y=\"55\" class=\"label\">数字码 D\u003c/text>\u003ctext x=\"30\" y=\"85\" class=\"small\">Dₙ₋₁ … D₁ D₀\u003c/text>\u003cpath class=\"wire arrow\" d=\"M135 67H220\"/>\u003crect class=\"block\" x=\"220\" y=\"35\" width=\"155\" height=\"68\" rx=\"8\"/>\u003ctext x=\"297\" y=\"66\" class=\"label center\">DAC\u003c/text>\u003ctext x=\"297\" y=\"87\" class=\"small center\">参考量 VREF\u003c/text>\u003cpath class=\"wire arrow\" d=\"M375 67H485\"/>\u003ctext x=\"495\" y=\"55\" class=\"label\">模拟量\u003c/text>\u003ctext x=\"495\" y=\"82\" class=\"small\">VOUT / IOUT\u003c/text>\u003ctext x=\"310\" y=\"165\" class=\"formula center\">码值越大，理想输出按设定比例增大\u003c/text>'},\n adc:{label:'模拟输入经采样量化编码为数字码',view:'0 0 680 270',caption:'流程图说明输入到码字的三个概念步骤；实际芯片内部结构随 ADC 类型而不同。',svg:'\u003cdefs>\u003cmarker id=\"adc-arrow\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\">\u003cpath d=\"M0 0L8 4L0 8Z\" fill=\"#286b72\"/>\u003c/marker>\u003c/defs>\u003ctext x=\"22\" y=\"57\" class=\"label\">模拟输入\ -]+-arrow\"/g,'id=\"'+id+'-arrow\"');\n return '\u003cfigure class=\"diagram-figure\">\u003cdiv class=\"diagram-viewport\">\u003csvg id=\"'+id+'-svg\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"'+d.view+'\" role=\"img\" aria-label=\"'+d.label+'\">\u003cstyle>#'+id+'-svg text{font-family:Microsoft YaHei,sans-serif;fill:#29494b}#'+id+'-svg .label{font-size:16px}#'+id+'-svg .small{font-size:12px;fill:#687c79}#'+id+'-svg .formula{font-size:14px;fill:#286b72}#'+id+'-svg .code{font-family:Consolas,monospace;font-size:18px;fill:#29494b}#'+id+'-svg .center{text-anchor:middle}#'+id+'-svg .wire{fill:none;stroke:#286b72;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}#'+id+'-svg .arrow{marker-end:url(#'+id+'-arrow)}#'+id+'-svg .warm-line{stroke:#bf7440}#'+id+'-svg .warm-text{fill:#a45d2f}#'+id+'-svg .block{fill:#e9f3ee;stroke:#83a99a;stroke-width:1.5}#'+id+'-svg .block.warm{fill:#fbf0e5;stroke:#d4a173}#'+id+'-svg .thin{stroke:#aac0b4;stroke-width:1}#'+id+'-svg .axis{fill:none;stroke:#9aada4;stroke-width:1.5}#'+id+'-svg .dash{stroke-dasharray:5 5}#'+id+'-svg .dot{fill:#286b72}\u003c/style>'+svg+'\u003c/svg>\u003c/div>\u003cfigcaption>'+d.caption+'\u003c/figcaption>\u003c/figure>';\n}\n\nconst $ = s => document.querySelector(s);\r\nconst $$ = s => Array.from(document.querySelectorAll(s));\r\nconst KEY = 'szu801.digital03-06.v1';\r\nconst TOTAL = BANK.questions.length;\r\nconst byId = new Map(BANK.questions.map(q => [q.id,q]));\r\nconst letters = ['A','B','C','D'];\r\nconst lessonById=new Map(LESSONS.map(l=>[l[1],l]));\r\nlet state = {answers:{},stars:[],current:1};\r\nlet moduleId = 'all', filter = 'all', view = 'learn', query = '';\r\nlet draft = {}, storageAvailable = true, toastTimer;\r\nconst esc = text => String(text).replace(/[&\u003c>\"']/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\r\nfunction rich(text) {\r\n  const symbols={VREF:'V\u003csub>REF\u003c/sub>',VOUT:'V\u003csub>OUT\u003c/sub>',LSB:'LSB',fmax:'f\u003csub>max\u003c/sub>',fs:'f\u003csub>s\u003c/sub>'};\r\n  return esc(text).replace(/\\b(VREF|VOUT|LSB|fmax|fs)\\b/g,m=>'\u003cspan class=\"math\">'+symbols[m]+'\u003c/span>');\r\n}\r\nfunction cleanRecord(raw) {\r\n  const result = {answers:{},stars:[],current:1};\r\n  if (!raw || typeof raw !== 'object') return result;\r\n  if (raw.answers && typeof raw.answers === 'object') for (const q of BANK.questions) {\r\n    const record = raw.answers[q.id];\r\n    if (record && Number.isInteger(record.choice) && record.choice>=0 && record.choice\u003c4) {\r\n      result.answers[q.id] = {choice:record.choice,correct:record.choice===q.answer,at:typeof record.at==='string'?record.at.slice(0,40):''};\r\n    }\r\n  }\r\n  if (Array.isArray(raw.stars)) result.stars = [...new Set(raw.stars.filter(id=>byId.has(id)))];\r\n  if (byId.has(raw.current)) result.current=raw.current;\r\n  return result;\r\n}\r\ntry {\r\n  const saved=localStorage.getItem(KEY);\r\n  state=cleanRecord(JSON.parse(saved));\r\n} catch(e) { storageAvailable=false; }\r\nfunction save() {\r\n  try { localStorage.setItem(KEY,JSON.stringify(state)); storageAvailable=true; } catch(e) { storageAvailable=false; }\r\n  $('#storage-warning').hidden=storageAvailable;\r\n}\r\nfunction toast(message) { $('#toast').textContent=message; $('#toast').hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(()=>$('#toast').hidden=true,3500); }\r\nfunction filtered() {\r\n  return BANK.questions.filter(q=>{\r\n    const a=state.answers[q.id];\r\n    return (moduleId==='all'||q.group===moduleId) &&\r\n      (filter==='all'||filter==='unanswered'&&!a||filter==='wrong'&&a&&!a.correct||filter==='starred'&&state.stars.includes(q.id)) &&\r\n      (!query||[q.stem,q.tag,q.number,...q.options,lessonById.get(q.lesson)?.[2]||''].join(' ').toLowerCase().includes(query.toLowerCase()));\r\n  });\r\n}\r\nfunction renderModules() {\r\n  $('#module-list').innerHTML = `\u003cbutton class=\"module-btn ${moduleId==='all'?'active':''}\" data-module=\"all\">\u003cspan class=\"module-letter\">∑\u003c/span>\u003cspan class=\"module-info\">全部模块\u003csmall>基础概念与一步简算\u003c/small>\u003c/span>\u003cspan class=\"module-number\">${TOTAL}\u003c/span>\u003c/button>` + BANK.groups.map(g=>`\u003cbutton class=\"module-btn ${moduleId===g.id?'active':''}\" data-module=\"${g.id}\">\u003cspan class=\"module-letter\">${g.batch}\u003c/span>\u003cspan class=\"module-info\">${esc(g.name)}\u003csmall>${'第'+g.batch+'批 · 教材'+g.section}\u003c/small>\u003c/span>\u003cspan class=\"module-number\">${BANK.questions.filter(q=>q.group===g.id).length}\u003c/span>\u003c/button>`).join('');\r\n}\r\nfunction renderStats() {\r\n  const answers=Object.values(state.answers),right=answers.filter(a=>a.correct).length;\r\n  $('#stat-done').innerHTML=`${answers.length}\u003csmall>/ ${TOTAL}\u003c/small>`;\r\n  $('#stat-right').textContent=right;\r\n  $('#stat-rate').textContent=answers.length?Math.round(right/answers.length*100)+'%':'—';\r\n  $('#stat-wrong').textContent=answers.length-right;\r\n  $('#progress-fill').style.width=answers.length/TOTAL*100+'%';\r\n  $('#progress-text').textContent=answers.length===TOTAL?`${TOTAL} 道精选题已全部作答`:answers.length?`已完成 ${Math.round(answers.length/TOTAL*100)}% · 按自己的节奏继续`:'从第一题开始';\r\n}\r\nfunction renderQuestion(list, preserve) {\r\n  if(!preserve&&!list.some(q=>q.id===state.current)) state.current=list[0]?.id??null;\r\n  const q=byId.get(state.current);\r\n  if(!q) { $('#question-area').innerHTML='\u003cdiv class=\"empty-state\">\u003cdiv class=\"eyebrow\">NO MATCHES\u003c/div>\u003ch2>这里暂时没有题目\u003c/h2>\u003cp>可切换模块、清除搜索，或选择其他筛选条件。\u003c/p>\u003cbutton id=\"clear-filter\" class=\"primary\">显示全部题目\u003c/button>\u003c/div>'; return; }\r\n  const a=state.answers[q.id],choice=a?.choice??draft[q.id],group=BANK.groups.find(g=>g.id===q.group),idx=list.findIndex(item=>item.id===q.id),starred=state.stars.includes(q.id);\r\n  $('#question-area').innerHTML=`\u003carticle class=\"question-card\" data-question-id=\"${q.id}\">\u003cdiv class=\"question-top\">\u003cdiv class=\"question-meta\">\u003cspan class=\"badge \">${'第'+group.batch+'批 · '+q.tag}\u003c/span>\u003cspan class=\"badge level\">${q.difficulty}\u003c/span>\u003c/div>\u003cbutton class=\"star-button ${starred?'on':''}\" id=\"star-question\" aria-pressed=\"${starred}\" aria-label=\"${starred?'取消收藏':'收藏本题'}\">${starred?'★':'☆'}\u003c/button>\u003c/div>\u003cdiv class=\"question-body\">\u003cbutton class=\"back-to-lesson text-button\" data-lesson-target=\"${q.lesson}\">← 复习：${esc(lessonById.get(q.lesson)?.[2]||'知识点')}\u003c/button>\u003cdiv class=\"question-id\">QUESTION ${String(q.number).padStart(2,'0')} / ${TOTAL}\u003c/div>\u003ch2 class=\"stem\">${rich(q.stem)}\u003c/h2>${diagram(q.fig,'q'+q.id)}\u003cdiv class=\"options\" role=\"group\" aria-label=\"选择答案\">${q.options.map((o,i)=>`\u003cbutton class=\"option ${choice===i?'selected':''} ${a&&i===q.answer?'correct':''} ${a&&choice===i&&!a.correct?'incorrect':''}\" data-choice=\"${i}\" aria-pressed=\"${choice===i}\" ${a?'disabled':''}>\u003cspan class=\"option-letter\">${letters[i]}\u003c/span>\u003cspan>${rich(o)}\u003c/span>${a&&i===q.answer?'\u003cspan class=\"option-status\" aria-label=\"正确答案\">✓\u003c/span>':a&&choice===i&&!a.correct?'\u003cspan class=\"option-status\" aria-label=\"你的错误答案\">×\u003c/span>':''}\u003c/button>`).join('')}\u003c/div>\u003cdiv class=\"answer-actions\">${a?'\u003cbutton id=\"retry-question\" class=\"text-button\">↻ 重新作答本题\u003c/button>':`\u003cbutton id=\"check-answer\" class=\"primary\" ${choice===undefined?'disabled':''}>核对答案\u003c/button>`}\u003cspan class=\"answer-hint\">1—4 选择 · Enter 核对\u003c/span>\u003c/div>${a?`\u003cdiv class=\"explanation\">\u003cdiv class=\"result ${a.correct?'':'wrong'}\">${a.correct?'✓ 回答正确':'× 本题答错'}\u003cspan>·\u003c/span>正确答案 ${letters[q.answer]}\u003c/div>\u003ch3>解析\u003c/h3>\u003cp>${rich(q.explanation)}\u003c/p>\u003cdiv class=\"pitfall\">\u003ch3>易错提醒\u003c/h3>\u003cp>${rich(q.pitfall)}\u003c/p>\u003c/div>\u003c/div>`:''}\u003c/div>\u003cdiv class=\"question-bottom\">\u003cbutton id=\"prev-question\" ${idx===0||!list.length?'disabled':''}>← 上一题\u003c/button>\u003cspan>${idx>=0?`当前筛选 ${idx+1} / ${list.length}`:'本题已完成当前筛选条件'}\u003c/span>\u003cbutton id=\"next-question\" ${idx===list.length-1||!list.length?'disabled':''}>下一题 →\u003c/button>\u003c/div>\u003c/article>`;\r\n}\r\nfunction renderMap(list) {\r\n  $('#filtered-count').textContent=`${list.length} 题`;\r\n  $('#question-grid').innerHTML=list.map(q=>{const a=state.answers[q.id];return `\u003cbutton class=\"grid-btn ${a?(a.correct?'is-right':'is-wrong'):''} ${q.id===state.current?'current':''} ${state.stars.includes(q.id)?'is-starred':''}\" data-goto=\"${q.id}\" aria-label=\"第${q.number}题，${a?(a.correct?'已答对':'已答错'):'未答'}${state.stars.includes(q.id)?'，已收藏':''}\" ${q.id===state.current?'aria-current=\"true\"':''}>${String(q.number).padStart(2,'0')}\u003c/button>`;}).join('');\r\n  $('#module-description').textContent=moduleId==='all'?'按第三至第六批专题学习，或从题号直接跳转。内容限于基础概念和一步简算。':BANK.groups.find(g=>g.id===moduleId).intro;\r\n}\r\nfunction renderCoverage() {\r\n  const complete=COVERAGE.filter(row=>row[2].every(id=>state.answers[id])).length;\r\n  $('#coverage-summary').innerHTML=`知识节点已全部作答 \u003cb>${complete} / ${COVERAGE.length}\u003c/b> · 这里只统计本合集精选内容`;\r\n  $('#coverage-body').innerHTML=COVERAGE.map(row=>`\u003ctr class=\"${row[0]==='关联拓展'?'opt-row':''}\">\u003ctd>第${BANK.groups.find(g=>g.id===byId.get(row[2][0]).group).batch}批 · ${row[0]}\u003c/td>\u003ctd>${esc(row[1])}\u003c/td>\u003ctd>${row[2].map(id=>`\u003cbutton class=\"qid-link\" data-goto=\"${id}\" aria-label=\"练习第${byId.get(id).number}题\">${String(byId.get(id).number).padStart(2,'0')}\u003c/button>`).join('')}\u003c/td>\u003ctd>${row[2].filter(id=>state.answers[id]).length} / ${row[2].length}\u003c/td>\u003c/tr>`).join('');\r\n}\r\nfunction render(preserve=false) {\r\n  const list=filtered();\r\n  renderModules(); renderStats(); renderQuestion(list,preserve); renderMap(list); renderCoverage();\r\n  $$('.filter').forEach(b=>b.classList.toggle('active',b.dataset.filter===filter));\r\n  $('#storage-warning').hidden=storageAvailable;\r\n}\r\nfunction switchView(name) {\r\n  if(!['learn','practice','coverage','guide'].includes(name))return;\r\n  view=name;\r\n  $$('.view').forEach(el=>el.hidden=el.id!=='view-'+name);\r\n  $$('.tab, .learn-entry').forEach(b=>{b.classList.toggle('active',b.dataset.view===name);b.setAttribute('aria-pressed',String(b.dataset.view===name));});\r\n  $$('.module-btn').forEach(b=>b.classList.toggle('active',view==='practice'&&b.dataset.module===moduleId));\r\n}\r\nfunction renderLessons(){\r\n $('#batch-index').innerHTML=BANK.groups.map(function(g){return '\u003cbutton class=\"batch-card\" data-learn-batch=\"'+g.id+'\">\u003cspan>第 '+g.batch+' 批\u003c/span>\u003cb>'+esc(g.name)+'\u003c/b>\u003csmall>'+BANK.questions.filter(function(q){return q.group===g.id}).length+' 道基础精选题\u003c/small>\u003c/button>'}).join('');\r\n $('#lesson-index').innerHTML=BANK.groups.map(function(g){return '\u003cdiv class=\"lesson-batch-label\" data-batch=\"'+g.id+'\">第 '+g.batch+' 批 · '+esc(g.name)+'\u003c/div>'+LESSONS.filter(function(l){return BANK.questions.some(function(q){return q.lesson===l[1]&&q.group===g.id})}).map(function(l){return '\u003cbutton data-lesson-target=\"'+l[1]+'\">'+esc(l[2])+'\u003c/button>'}).join('')}).join('');\r\n const images={'learn-A1':'dac','learn-A2':'adc','learn-B1':'memory','learn-B2':'memory-array','learn-C1':'hazard','learn-C2':'hazard-wave','learn-C3':'async','learn-C4':'bus','learn-D1':'pld','learn-D2':'hdl','learn-D3':'families'};\r\n $('#lesson-container').innerHTML=LESSONS.map(function(l,i){const g=BANK.groups.find(function(x){return BANK.questions.some(function(q){return q.lesson===l[1]&&q.group===x.id})});return '\u003cdetails class=\"lesson-card\" id=\"'+l[1]+'\" data-batch=\"'+g.id+'\">\u003csummary>\u003cspan class=\"lesson-number\">'+String(i+1).padStart(2,'0')+'\u003c/span>\u003cspan class=\"lesson-title\">'+esc(l[2])+'\u003csmall>'+esc(l[0])+'\u003c/small>\u003c/span>\u003cspan class=\"lesson-level\">基础概念\u003c/span>\u003c/summary>\u003cdiv class=\"lesson-body\">\u003cp>'+esc(l[3])+'\u003c/p>'+diagram(images[l[1]],l[1])+'\u003cdiv class=\"lesson-formulas\">'+l[4].map(function(f){return '\u003cspan>'+esc(f)+'\u003c/span>'}).join('')+'\u003c/div>\u003cdiv class=\"lesson-example\">\u003cb>看一个例子\u003c/b>\u003cp>'+esc(l[6])+'\u003c/p>\u003c/div>\u003cdiv class=\"lesson-tip\">\u003cb>易混点与范围\u003c/b>\u003cp>'+esc(l[7])+'\u003c/p>\u003c/div>\u003cdiv class=\"lesson-practice\">\u003cspan>对应练习\u003c/span>'+l[5].map(function(id){return '\u003cbutton data-goto=\"'+id+'\">'+String(id).padStart(2,'0')+' '+esc(byId.get(id).tag)+'\u003c/button>'}).join('')+'\u003c/div>\u003c/div>\u003c/details>'}).join('');\r\n}\r\nfunction showBatch(id){\r\n  if(!BANK.groups.some(g=>g.id===id))return;\r\n  $$('.lesson-card').forEach(c=>{c.hidden=c.dataset.batch!==id;c.open=false;});\r\n  $$('#lesson-index [data-lesson-target]').forEach(b=>{b.hidden=BANK.questions.find(q=>q.lesson===b.dataset.lessonTarget)?.group!==id;});\r\n  $$('.lesson-batch-label').forEach(b=>b.hidden=b.dataset.batch!==id);\r\n  $$('.batch-card').forEach(b=>{b.classList.toggle('active',b.dataset.learnBatch===id);b.setAttribute('aria-pressed',String(b.dataset.learnBatch===id));});\r\n  const first=document.querySelector('.lesson-card[data-batch=\"'+id+'\"]');if(first)first.open=true;\r\n}\r\n\r\nfunction openLesson(id) {\r\n  const lesson=document.getElementById(id);\r\n  if(!lesson||!lesson.classList.contains('lesson-card'))return;\r\n  showBatch(lesson.dataset.batch);switchView('learn');lesson.open=true;\r\n  lesson.scrollIntoView({block:'start'});lesson.querySelector('summary').focus({preventScroll:true});\r\n}\r\nfunction focusQuestion() {\r\n  const target=$('#question-area .stem')||$('#question-area');\r\n  target.tabIndex=-1;target.focus({preventScroll:true});\r\n  $('#question-area').scrollIntoView({block:'start'});\r\n}\r\nfunction go(id,reset=false) {\r\n  if(reset) { moduleId='all';filter='all';query='';$('#search').value=''; }\r\n  if(!byId.has(id)) return;\r\n  state.current=id; switchView('practice'); render(); save();\r\n  focusQuestion();\r\n}\r\nfunction navigate(delta) {\r\n  const list=filtered(),idx=list.findIndex(q=>q.id===state.current);\r\n  const next=idx\u003c0?(delta>0?list[0]:list.at(-1)):list[idx+delta];\r\n  if(next) go(next.id);\r\n}\r\nfunction choose(choice) { if(!byId.has(state.current)||state.answers[state.current]) return;draft[state.current]=choice;render(true); }\r\nfunction check() {\r\n  const q=byId.get(state.current),choice=draft[state.current];\r\n  if(!q||state.answers[q.id]||choice===undefined)return;\r\n  state.answers[q.id]={choice,correct:choice===q.answer,at:new Date().toISOString()};save();render(true);\r\n}\r\nfunction printBank(solutions) {\r\n  let html=`\u003cdiv class=\"print-cover\">\u003ch1>数电第三至六批 · 基础拓展练习\u003c/h1>\u003cp>深大801电子电路 · ${TOTAL}道原创四选一单选题${solutions?' · 含解析':' · 学生练习版'}\u003c/p>\u003cp>题目按既定专项计划编写，覆盖基础概念、简单读图和一步计算；不是官方试题。\u003c/p>\u003cp>计算与工作条件以题设给定模型为准；较复杂的设计和时序推导不列入本合集。姓名：__________________ 日期：__________________\u003c/p>\u003c/div>`;\r\n  for (const g of BANK.groups) {\r\n    html+=`\u003ch2 class=\"print-section\">第${g.batch}批　${g.name}\u003c/h2>`;\r\n    for(const q of BANK.questions.filter(q=>q.group===g.id)) html+=`\u003carticle class=\"print-question\">\u003cdiv class=\"print-meta\">${g.section} · ${q.tag} · ${q.difficulty}\u003c/div>\u003ch3>${String(q.number).padStart(2,'0')}. ${rich(q.stem)}\u003c/h3>${diagram(q.fig,'print'+q.id)}\u003cdiv class=\"print-options\">${q.options.map((o,i)=>`\u003cdiv>${letters[i]}. ${rich(o)}\u003c/div>`).join('')}\u003c/div>${solutions?`\u003cdiv class=\"print-answer\">\u003cb>答案：${letters[q.answer]}\u003c/b>\u003cp>解析：${rich(q.explanation)}\u003c/p>\u003cp>易错提醒：${rich(q.pitfall)}\u003c/p>\u003c/div>`:''}\u003c/article>`;\r\n  }\r\n  if(solutions) html+=`\u003ch2 class=\"print-section\">答案速查\u003c/h2>\u003cp class=\"print-key\">${BANK.questions.map(q=>`${q.number}.${letters[q.answer]}`).join('　')}\u003c/p>`;\r\n  html+='\u003cp class=\"print-source\">本合集为原创拓展练习，不是官方试题，也不表示命题概率。正式范围与器件特性应以深圳大学对应年份 801 考试大纲和具体芯片数据手册为准。\u003c/p>';\r\n  $('#print-root').innerHTML=html;\r\n  window.print();\r\n}\r\ndocument.addEventListener('click',event=>{\r\n  const b=event.target.closest('button');if(!b)return;\r\n  if(b.dataset.view) { switchView(b.dataset.view);if(view==='practice')focusQuestion();return; }\r\n  if(b.dataset.module) { moduleId=b.dataset.module;switchView('practice');render();save();return; }\r\n  if(b.dataset.filter) { filter=b.dataset.filter;render();save();return; }\r\n  if(b.dataset.lessonTarget) {openLesson(b.dataset.lessonTarget);return;}\r\n  if(b.dataset.learnBatch){showBatch(b.dataset.learnBatch);return;}\r\n  if(b.dataset.practiceBatch){moduleId=b.dataset.practiceBatch;filter='all';query='';$('#search').value='';switchView('practice');render();save();focusQuestion();return;}\r\n  if(b.dataset.goto) {go(Number(b.dataset.goto),view==='coverage'||view==='learn');return;}\r\n  if(b.dataset.choice!==undefined) {choose(Number(b.dataset.choice));return;}\r\n  switch(b.id) {\r\n    case 'star-question': state.stars=state.stars.includes(state.current)?state.stars.filter(id=>id!==state.current):[...state.stars,state.current];save();render(true);break;\r\n    case 'check-answer': check();break;\r\n    case 'retry-question': delete state.answers[state.current];delete draft[state.current];save();render(true);break;\r\n    case 'prev-question':navigate(-1);break;\r\n    case 'next-question':navigate(1);break;\r\n    case 'continue-btn': {const q=filtered().find(q=>!state.answers[q.id]);q?go(q.id):toast('当前筛选中的题目已全部作答');break;}\r\n    case 'clear-filter':moduleId='all';filter='all';query='';$('#search').value='';render();break;\r\n    case 'export-btn':{\r\n      const data={kind:'szu801-digital03-06-progress',version:1,edition:BANK.edition,exportedAt:new Date().toISOString(),...state};\r\n      const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));\r\n      const a=document.createElement('a');a.href=url;a.download='深大801-数电第三至六批-学习进度.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('进度已导出，请保存下载的 JSON 文件');break;\r\n    }\r\n    case 'import-btn':$('#import-file').click();break;\r\n    case 'print-questions':printBank(false);break;\r\n    case 'print-solutions':printBank(true);break;\r\n    case 'reset-btn':if(confirm('清空这份题集的所有作答和收藏记录？此操作无法撤销。可先导出进度备份。')){state={answers:{},stars:[],current:1};draft={};save();render();toast('本页进度已清空');}break;\r\n  }\r\n});\r\n$('#search').addEventListener('input',event=>{query=event.target.value.trim();render();});\r\n$('#import-file').addEventListener('change',async event=>{\r\n  const file=event.target.files[0];if(!file)return;\r\n  try {\r\n    if(file.size>1024*1024)throw new Error('文件超过 1 MB，请选择本题集导出的进度 JSON');\r\n    const raw=JSON.parse(await file.text());\r\n    if(raw.kind!=='szu801-digital03-06-progress'||raw.version!==1)throw new Error('这不是本题集可识别的进度文件');\r\n    const imported=cleanRecord(raw);\r\n    state={answers:{...state.answers,...imported.answers},stars:[...new Set([...state.stars,...imported.stars])],current:imported.current};\r\n    draft={};save();render();toast('已合并导入 '+Object.keys(imported.answers).length+' 道题的作答记录');\r\n  }catch(e){toast('导入失败：'+(e instanceof SyntaxError?'JSON 格式不正确':e.message));}\r\n  event.target.value='';\r\n});\r\ndocument.addEventListener('keydown',event=>{\r\n  if(view!=='practice'||event.ctrlKey||event.altKey||event.metaKey||/INPUT|TEXTAREA|SELECT/.test(event.target.tagName))return;\r\n  if(/^[1-4]$/.test(event.key)){event.preventDefault();choose(Number(event.key)-1);}\r\n  else if(event.key==='Enter'&&!event.target.closest('button')){event.preventDefault();check();}\r\n  else if(event.key==='ArrowLeft'){event.preventDefault();navigate(-1);}\r\n  else if(event.key==='ArrowRight'){event.preventDefault();navigate(1);}\r\n});\r\n$('.brand').addEventListener('click',event=>{event.preventDefault();switchView('learn');$('#view-learn').scrollIntoView({block:'start'});});\r\n$$('[data-diagram]').forEach(el=>el.innerHTML=diagram(el.dataset.diagram,el.id));\r\nrenderLessons();render();showBatch('A');switchView('learn');save();\r\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"}]</script>
<script>
(() => {
  const integratedCss=`
    .integrated-shell .hero,.integrated-shell .topbar .brand,.integrated-shell .topbar .edition{display:none!important}
    .integrated-shell .topbar{height:auto!important;min-height:54px!important;max-width:none!important;margin:0!important;padding:8px 20px!important;justify-content:flex-start!important;gap:12px!important;border-bottom:1px solid var(--line)}
    .integrated-shell .tabs{width:auto!important;order:initial!important;flex-wrap:wrap!important;justify-content:flex-start!important}
    .integrated-shell .app-shell{max-width:1536px!important;margin:12px auto!important;padding:0 20px!important}
    .integrated-shell[data-integrated-page="digital36"] .sidebar{display:none!important}
    .integrated-shell[data-integrated-page="digital36"] .app-shell{grid-template-columns:minmax(0,1fr)!important;gap:0!important;max-width:1280px!important}
    .integrated-shell[data-integrated-page="digital36"] #view-learn>.learn-intro,
    .integrated-shell[data-integrated-page="digital36"] #batch-index,
    .integrated-shell[data-integrated-page="digital36"] #batch-practice-links,
    .integrated-shell[data-integrated-page="digital36"] .learn-route{display:none!important}
    .integrated-shell[data-integrated-page="digital36"] #lesson-index{display:block!important;margin:0 0 14px!important;padding:0 0 11px!important;border-bottom:1px solid var(--line)}
    .integrated-shell[data-integrated-page="digital36"] #lesson-index [data-lesson-target]{display:none!important}
    .integrated-shell[data-integrated-page="digital36"] .lesson-batch-label{margin:0!important;font-size:22px!important;font-weight:700!important;line-height:1.4!important}
    .integrated-shell[data-integrated-page="digital36"] .lesson-batch-label[hidden]{display:none!important}
    .integrated-shell[data-integrated-page="digital36"] #view-guide .side-actions{display:flex;gap:10px;margin:18px 0 0;padding-top:16px;border-top:1px solid var(--line)}
    .integrated-shell[data-integrated-page="digital36"] #view-guide .local-note{margin:8px 0 0}
    .integrated-shell .lesson-arrow{display:none!important}
    @media(max-width:760px){
      .integrated-shell .topbar{min-height:0!important;padding:8px 12px!important}
      .integrated-shell .tabs{width:100%!important;justify-content:space-between!important}
      .integrated-shell .app-shell{margin:10px auto!important;padding:0 12px!important}
      .integrated-shell[data-integrated-page="digital36"] .app-shell{grid-template-columns:minmax(0,1fr)!important}
    }
  `;
  const data=JSON.parse(document.getElementById('app-data').textContent);
  const batchRoutes={
    1:{page:'digital01',title:'脉冲产生与整形'},
    2:{page:'digital02',title:'555 定时器'},
    3:{page:'digital36',title:'D/A 与 A/D 转换'},
    4:{page:'digital36',title:'存储器'},
    5:{page:'digital36',title:'时序与接口'},
    6:{page:'digital36',title:'可编程逻辑与 HDL'}
  };
  const navButtons=[...document.querySelectorAll('.batch-btn')];
  const label=document.getElementById('selected-title');
  const status=document.getElementById('status');
  const frames=new Map();
  const loaded=new Set();
  const requested=new Set();
  for(const item of data){
    const frame=document.createElement('iframe');
    frame.className='batch-frame';
    frame.dataset.page=item.page;
    frame.title=item.title;
    frame.setAttribute('aria-label',frame.title);
    frames.set(item.page,frame);
    frame.addEventListener('load',()=>{
      const doc=frame.contentDocument;
      if(!doc?.querySelector('#view-learn'))return;
      doc.body.classList.add('integrated-shell');
      doc.body.dataset.integratedPage=item.page;
      if(!doc.getElementById('integration-presentation')){
        const style=doc.createElement('style');
        style.id='integration-presentation';
        style.textContent=integratedCss;
        doc.head.append(style);
      }
      loaded.add(item.page);
      if(item.page==='digital36'){
        const guide=doc.querySelector('#view-guide .guide-card');
        const actions=doc.querySelector('.sidebar .side-actions');
        const note=doc.querySelector('.sidebar .local-note');
        if(guide&&actions&&!actions.dataset.relocated){guide.append(actions);actions.dataset.relocated='true';}
        if(guide&&note&&!note.dataset.relocated){guide.append(note);note.dataset.relocated='true';}
        doc.addEventListener('click',()=>queueMicrotask(()=>{
          if(!frame.classList.contains('active'))return;
          let batch;
          if(!doc.getElementById('view-learn').hidden){
            const group=doc.querySelector('.batch-card.active')?.dataset.learnBatch;
            batch={A:3,B:4,C:5,D:6}[group];
          }else if(!doc.getElementById('view-practice').hidden){
            const match=doc.querySelector('.question-meta .badge')?.textContent.match(/第([3-6])批/);
            if(match)batch=Number(match[1]);
          }
          if(batch){frame.dataset.selectedBatch=String(batch);updateNavigation(batch);}
        }));
        activateCombinedBatch(Number(frame.dataset.selectedBatch));
      }
    });
    document.body.insertBefore(frame,document.getElementById('app-data'));
  }
  function activateCombinedBatch(batch){
    const frame=frames.get('digital36');
    const group={3:'A',4:'B',5:'C',6:'D'}[batch];
    frame.contentDocument.querySelector('[data-view="learn"]')?.click();
    frame.contentDocument.querySelector('[data-learn-batch="'+group+'"]')?.click();
    frame.contentDocument.querySelector('[data-practice-batch="'+group+'"]')?.click();
    frame.contentDocument.querySelector('[data-view="learn"]')?.click();
    frame.contentWindow.scrollTo(0,0);
  }
  function updateNavigation(batch){
    const route=batchRoutes[batch];
    navButtons.forEach(button=>{
      if(Number(button.dataset.batch)===batch){
        button.setAttribute('aria-current','page');
        button.scrollIntoView({inline:'nearest',block:'nearest'});
      }else button.removeAttribute('aria-current');
    });
    label.textContent='第'+batch+'批 · '+route.title;
    document.title='数电第'+batch+'批 '+route.title+' · 深大801';
    history.replaceState(null,'','#batch-'+batch);
  }
  function showBatch(batch){
    const route=batchRoutes[batch];
    if(!route)return;
    const frame=frames.get(route.page);
    for(const [pageKey,candidate] of frames){
      const active=pageKey===route.page;
      candidate.classList.toggle('active',active);
      candidate.hidden=!active;
    }
    updateNavigation(batch);
    status.hidden=true;
    frame.dataset.selectedBatch=String(batch);
    if(!requested.has(route.page)){
      requested.add(route.page);
      frame.srcdoc=data.find(entry=>entry.page===route.page).html;
    }else if(loaded.has(route.page)&&batch>=3)activateCombinedBatch(batch);
  }
  navButtons.forEach(button=>button.addEventListener('click',()=>showBatch(Number(button.dataset.batch))));
  document.querySelector('.brand').addEventListener('click',event=>{event.preventDefault();showBatch(1);});
  window.addEventListener('hashchange',()=>{
    const match=location.hash.match(/^#batch-([1-6])$/);
    if(match)showBatch(Number(match[1]));
  });
  const initial=Number(location.hash.match(/^#batch-([1-6])$/)?.[1]||1);
  showBatch(initial);
})();
</script>
